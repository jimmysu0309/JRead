<html>
<head><meta charset="utf-8"></head>
<body>
  <article>
    <h1>史上最慢的磁碟機</h1>
    <div data-test="header-block">
      <h2 data-test="subtitle">以及人們如何讓它起死回生，成為史上最快</h2>
      <div data-test="byline-root">
        <div data-test="byline-mid">
          <div data-test="author-row"><a href="/@enzo">恩佐·隆巴迪</a></div>
          <div data-test="rt-row" style="margin-bottom: 18px;">
            <div data-test="merged-item" style="font-size: 20px;">閱讀 15 分鐘·5 天前</div>
          </div>
        </div>
      </div>
    </div>
    <div data-test="body">
      <p data-test="p1">Commodore 1541 被公認為史上最慢的消費級磁碟機。它剛出廠時，若與 Commodore 64 連接使用，資料傳輸速度大約只有每秒 400 位元組。要填滿機器內 64 KB 的記憶體，載入一個程式竟然需要耗費超過兩分鐘的時間才能完成。</p>
      <p data-test="p2">三十年後，在完全相同的未改裝硬體上執行的軟體，以每秒約一萬六千位元組的速度載入相同的資料，這是愛好者社群三十年來累積的工程成果。</p>
    </div>
  </article>
