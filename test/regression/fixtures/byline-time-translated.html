    <h1 data-shinkansen-translated="1" lang="zh-TW">研究發現：讓社會新鮮人坐冷板凳的罪魁禍首不是 AI，而是遠距工作</h1>

    <p data-test="body" data-shinkansen-translated="1" lang="zh-TW">大學校園裡盛傳人工智慧正在擾亂年輕大學畢業生的就業市場，但新研究發現真正的罪魁禍首或許另有其人：大型雇主的遠距工作安排才是關鍵所在。</p>
    <p data-shinkansen-translated="1" lang="zh-TW">對聯邦就業數據的分析顯示，企業比較不願意把應屆大學畢業生招聘進可以遠距完成的職務。</p>
