<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>進度條皮膚 fixture</title>
</head>
<body>
  <article id="post">
    <h1>頂端進度條皮膚</h1>
    <p>進度條是 fixed 定位疊在捲動內容之上，底下的背景不是主題色而是當下捲到畫面頂端的任何內容，所以單一顏色一定會在某段背景上被吃掉。</p>
    <p>本 fixture 只需要一個可被 styler 套用的主文容器，皮膚驗證讀的是注入 stylesheet 的內容，不依賴任何特定 DOM 結構。</p>
  </article>
</body>
</html>
