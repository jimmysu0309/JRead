<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Medium click-to-zoom button wrapper forcing</title>
  <meta property="og:title" content="Medium image click-to-zoom test">
</head>
<body>
  <!-- v0.7.11 Medium click-to-zoom 圖片 wrapper 修法 forcing：
       Medium 把主文 <picture>/<img> 嵌在 <div role="button" tabindex="0">
       wrapper 裡（點擊查看大圖、a11y 有「Press enter or click to view
       image in full size」）。v0.7.3 `hideInsideArticleAllButtons` rule
       無條件 hide 所有 button / [role="button"]，連帶把 picture 一起
       hide、圖片在 reader mode 消失。

       新 guard：button wrapper 內含 img/picture/video 時保留整個 wrapper。

       Fixture forcing：
       - `#zoom-btn`：role="button"、內含 picture + img（主文圖片）→
         guard 生效，保留；forcing 拿掉 guard → 此 wrapper 被 hide、picture/
         img 連帶不可見
       - `#share-btn`：純 CTA button（無 img/picture）→ 正常被 hide
       - `#icon-btn`：button 含 svg icon（非 img/picture）→ 正常被 hide -->
  <article class="article">
    <h1>MEDIUM_MAIN_MARK Click-to-zoom image test</h1>
    <p>Lead paragraph. Medium 主文常在段落之間插入大圖，圖片以 picture 結構包在 role="button" 的 wrapper 裡讓使用者點擊放大。</p>

    <figure class="paragraph-image">
      <div id="zoom-btn" role="button" tabindex="0" class="oi oj ek">
        <span class="a11y-label">Press enter or click to view image in full size</span>
        <div>
          <picture>
            <source srcset="https://miro.medium.com/v2/resize:fit:640/format:webp/test.jpeg 640w" />
            <img id="main-img" src="https://miro.medium.com/v2/resize:fit:1400/test.jpeg" alt="" width="700" height="472" />
          </picture>
        </div>
      </div>
    </figure>

    <p>MEDIUM_MAIN_MARK 後續段落。reader mode 應保留主文圖片（zoom-btn wrapper + picture + img）。</p>

    <div id="share-btn" role="button" tabindex="0">Share this article</div>

    <div id="icon-btn" role="button" tabindex="0">
      <svg width="16" height="16" viewBox="0 0 16 16">
        <path d="M8 0L0 8 8 16 16 8z" />
      </svg>
    </div>

    <p>MEDIUM_MAIN_MARK 結尾段落。share / icon button（無主文媒體）應被清除。</p>
  </article>
</body>
</html>
