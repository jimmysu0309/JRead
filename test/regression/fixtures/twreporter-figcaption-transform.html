<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>twreporter figcaption transform 側欄圖說：translateX(100%) 把圖說推到圖右</title>
<style>
/* 原站 layout：figure 內 imageWrapper（圖）+ figcaption（圖說）。站點用
   position:absolute + transform: translateX(100%) 把圖說推進圖片右側 sidebar
   gutter。reader single column 下 position 被打回 static，但殘留的 transform
   仍把圖說整條平移出圖片右緣 → 圖說跑到圖右破版。 */
figure { position: static; }
figure figcaption {
  position: absolute;
  right: -21px;
  bottom: 0;
  width: 180px;
  transform: translateX(100%);
}
</style>
</head><body>
<main>
  <article class="article-body-item">
    <h1>twreporter 側欄圖說 transform 測試</h1>

    <p>從高雄醫學大學藥學系教授、前衛生署管制藥品管理局局長李志恆 2015 年與外國學者共同發表的論文可以發現，卡痛學名是美麗帽柱木。本段為主文段落，長度需足夠讓 Readability 命中主文容器。</p>

    <figure>
      <div class="image__ImageWrapper">
        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
             width="600" height="400" alt="李志恆">
      </div>
      <figcaption>高雄醫學大學藥學系教授、前衛生署管制藥品管理局局長李志恆。（攝影／吳逸驊）</figcaption>
    </figure>

    <p>而卡痛的成癮性與戒斷症狀，相較於其他鴉片類藥物明顯較弱。本段為主文接續段落，補足主文字數讓偵測穩定命中 article 容器，不受單一 figure 影響。</p>
    <p>卡痛在東南亞被當作勞動者提神與止痛的傳統植物，長期使用歷史悠久。這是第三段主文，確保主文內容量充足。</p>
  </article>
</main>
</body></html>
