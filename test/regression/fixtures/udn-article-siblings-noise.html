<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>聯合新聞網 — article 內雜訊 sections (keyword heuristic forcing)</title>
  <meta property="og:title" content="賴總統出訪行程暫緩">
</head>
<body>
  <!-- 2026-04-23 udn.com/news/story/124844/9460037 實測：detector 選到
       section.article-content__wrapper，內含 article 後跟 5 個雜訊 sections：
         - section.more-news.article-section.context-box        延伸閱讀
         - section.related-news.more-news.context-box           相關新聞
         - div#taboola-below-article-thumbnails                 Taboola widget
         - section.sponsor-ads.article-section.context-box      贊助廣告
         - section.discuss-board.article-section.context-box    留言板
       這些 section 以 class/id 字樣命名雜訊 family，舊 NOISE_KEYWORD_RE 名單
       全數漏網：`related-articles` 不 match `related-news`；`sponsored` 名詞
       不 match `sponsor-ads`；`discussion` 名詞不 match `discuss-board`；
       `more-news` / `taboola` 未收入。通則修法：alternation 擴充
         - related-(articles|news|posts|stories)
         - more-(news|stories|posts|articles)
         - sponsor (動詞詞根)
         - discuss (動詞詞根)
         - taboola

       Forcing function 設計：
       - 所有雜訊 sections 放在 `<article>` 內（`hideAncestorSiblings` 只動
         祖兄、不動後代）
       - 主文 textLen < 500，避免觸發 `hideInsideArticleSidebarColumns`（該
         rule 要求 main >= 500 才進 inner loop）
       - sibling sections 含純文字段落（非 link-heavy），condA 的 ld > 0.5
         也無機會觸發
       → 只有主文內 keyword heuristic 能 hide 這些 section。退回舊名單會讓
         所有 5 條 assertion 同時 fail。

       v0.7.83：原本每個 widget 內 <p> 是「測試說明文字」（200+ chars），
       會觸發新加的「主文 anchor 保護」guard（>= 100 chars 單一 p 的 wrapper
       視為主文容器、不 hide），導致 widget 被誤判為主文。真實 udn widget 的
       p 是短摘要（<< 100 chars，多為單行標題式列表），改成真實結構：每個
       widget 用 <ul><li><a> 列表項或極短 p。 -->
  <article class="article-content">
    <p>UDN_MAIN_MARK 總統府今（23）日證實，賴清德總統原定下週啟程的中美洲友邦訪問行程將暫緩，改期至六月再啟程。</p>
    <p>陸委會下午表示對岸沒有資格為台灣定義兩岸現實；外交部補充六月改期細節將於下月初對外說明。</p>

    <section class="more-news article-section context-box">
      <header><h2 id="extends">延伸閱讀</h2></header>
      <ul>
        <li><a href="/news/story/1">總統府再回應</a></li>
        <li><a href="/news/story/2">陸委會說法</a></li>
      </ul>
    </section>

    <section class="related-news more-news context-box article-section">
      <header><h2>相關新聞</h2></header>
      <ul>
        <li><a href="/news/story/3">外交部表態</a></li>
        <li><a href="/news/story/4">立委質詢</a></li>
      </ul>
    </section>

    <div id="taboola-below-article-thumbnails" class="trc_related_container">
      <p>Taboola 推薦</p>
    </div>

    <section class="sponsor-ads article-section context-box">
      <header><h2>贊助廣告</h2></header>
      <p>業配連結佔位</p>
    </section>

    <section class="discuss-board article-section context-box">
      <header><h2>留言板</h2></header>
      <p>留言區佔位</p>
    </section>
  </article>
</body>
</html>
