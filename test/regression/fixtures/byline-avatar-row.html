<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>告別化學塗層後的生活</title>
</head>
<body>
<main>
  <article>
    <h1>告別化學塗層後的生活</h1>
    <!-- 模擬 wirecutter 作者列：頭像 row + 「By 作者連結」同一個短文字區塊。
         此區塊在 styler byline 標記範圍外（byline root 只標日期行）——cleaner
         的 hideBylineAvatarImgs 走 DOM 軌吃這型。頭像帶 width/height attr
         （jsdom rect 全 0、naturalWidth 0，規則 fallback 讀 attr） -->
    <div class="authors-row" data-test="authors-row">
      <div class="faces">
        <a href="/author/a"><img data-test="avatar-1" src="a1.jpg" width="50" height="50" alt="林靜怡"></a>
        <a href="/author/b"><img data-test="avatar-2" src="a2.jpg" width="50" height="50" alt="陳大文"></a>
      </div>
      <p>By <a href="/author/a">林靜怡</a> and <a href="/author/b">陳大文</a></p>
    </div>
    <p>你大概在過去幾年看過永久化學物質成為新聞焦點，這類化合物長期被用於製造不沾鍋具與高性能雨具，但由於健康風險，現在正逐步從特定產品類別中淘汰。</p>
    <p>本集節目中，永續主題編輯說明日常接觸這些化合物的潛在健康風險，並解析新一波無塗層鍋具、化妝品與戶外裝備，指出哪些替代品真正值得購買。</p>
    <!-- 控制組一：figure 內小圖 + 含日期的圖說——BYLINE_TEXT_RE 日期 pattern
         會命中圖說文字，但 figure 是內容媒體、必須豁免不清 -->
    <figure data-test="content-figure">
      <img data-test="small-chart" src="chart.jpg" width="100" height="80" alt="圖表">
      <figcaption>市占率變化圖，攝於 2026 年 7 月 28 日</figcaption>
    </figure>
    <!-- 控制組二：內文大圖（超過頭像尺寸上限），即使段落含日期也不清 -->
    <div>
      <img data-test="big-photo" src="big.jpg" width="600" height="400" alt="工廠照片">
      <p>2026 年 7 月 28 日拍攝的工廠外觀。</p>
    </div>
  </article>
</main>
</body>
</html>
