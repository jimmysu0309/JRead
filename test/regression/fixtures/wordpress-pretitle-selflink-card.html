<!DOCTYPE html>
<!--
  itsmicracing.xyz（WordPress block theme）實證最小重現（v0.8.97）：
  - 頁面在 articleEl 外有一張 compact post-header 卡片（wp-block-group）：
    分類 chip + 自連結 post-title（<h2.wp-block-post-title><a href=permalink>）+ 作者
  - articleEl 內主標題是「純文字」h2.wp-block-post-title（非自連結，置中那顆）+ 內文
  - 整篇無 h1（block theme 主標題用 h2）

  舊 bug：promoteArticleTitleClassHeadingInto 只檢查 articleEl 內有沒有 h1
  （此站無）→ 去 page-wide 找第一個 title-class heading＝外面那張卡的自連結
  post-title → wrapper 文字 ≈ 標題 → 把整張卡（含分類/作者）clone 進 reader card
  頂部，成「標題上方雜訊」。

  期望：articleEl 內已有 visible 的 strict-title-class h2（真標題）→ 不 promote、
  不產生 title clone；外面那張卡不被 clone 進來。
-->
<html>
<head><meta charset="utf-8"><title>三搶一 or 一擋三</title></head>
<body>

  <!-- articleEl 外的 compact post-header 卡片（自連結 post-title 重複渲染） -->
  <div class="wp-block-group has-global-padding" data-test="outside-card">
    <div class="taxonomy-category wp-block-post-terms">
      <a href="/three-vs-one/" rel="tag">Haas F1</a>
    </div>
    <h2 class="wp-block-post-title has-medium-font-size" data-test="card-title">
      <a href="/three-vs-one/">三搶一 or 一擋三</a>
    </h2>
    <div class="wp-block-post-author-name">
      <a href="/author/mike-h/" class="wp-block-post-author-name__link">Huang Mike</a>
    </div>
  </div>

  <!-- 偵測到的主文容器 -->
  <article data-test="article-root">
    <!-- 真標題區（置中 header）：純文字 post-title + 作者 + 日期 + 分類 -->
    <div class="wp-block-group has-base-color is-vertical" data-test="title-branch">
      <div class="wp-block-group alignwide has-contrast-background-color has-background">
        <h2 class="has-text-align-center wp-block-post-title has-base-color" data-test="main-title">三搶一 or 一擋三</h2>
        <div class="has-text-align-center wp-block-post-author-name" data-test="byline">
          <a href="/author/mike-h/" class="wp-block-post-author-name__link">Huang Mike</a>
        </div>
        <div class="has-text-align-center wp-block-post-date">
          <time datetime="2026-06-17">2026 年 6 月 17 日上午 10:09</time>
        </div>
      </div>
    </div>

    <!-- 內文 -->
    <div class="entry-content wp-block-post-content" data-test="main-content">
      <p>前一段時間曾經出現過 HAAS 車手 Esteban Ocon 跟車隊領隊小松禮雄之間的傳聞，外界一度認為兩人的合作關係出現裂痕，但這樣的說法究竟有幾分真實性，恐怕還需要時間來驗證雙方的默契與信任程度。</p>
      <h2 class="wp-block-heading" data-test="section-heading">Rafael Câmara</h2>
      <p>首先就是近期備受關注的巴西車手 Rafael Câmara，他目前是法拉利車手學院的成員之一，憑藉著穩定的表現與優異的成績逐漸累積出屬於自己的聲量與支持度，被視為未來相當值得期待的潛力新星。</p>
    </div>
  </article>

</body>
</html>
