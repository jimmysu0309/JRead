<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>字級設定 widget 最小重現</title>
</head>
<body>
<!-- chinatimes 實測（2026-06-11 page rounds，audit 無信號靠抽查抓到）：
     圖說下方殘留「字級設定：」原站字級調整 UI。
     結構：SPAN.title < DIV.font-size-setting < DIV.article-function。
     修法雙保險：NOISE_TOKEN_DEFS 加 font-?size-?setting / article-function
     class token + NOISE_HEADING_TEXT_RE 加 ^字(級|體)(設定|大小)$ 文字 pattern -->
<main>
  <article id="post">
    <h1>主文標題：本日重要新聞事件的完整報導</h1>
    <div class="article-function">
      <div class="font-size-setting">
        <span class="title">字級設定：</span>
        <span class="size-option">小</span>
        <span class="size-option">中</span>
        <span class="size-option">大</span>
      </div>
    </div>
    <p>第一段主文內容。這段文字需要足夠長，讓偵測器把這個 article 元素選為
    主文容器，同時讓各個 wrapper 保護規則有正確的主文錨點可以辨識，避免測試
    環境中因字數不足而走到非預期的程式路徑。</p>
    <p>第二段主文內容，繼續累積文字量。字級設定屬於站方的閱讀輔助 UI，在
    閱讀模式下由擴充功能自己的字級設定取代，原站的控制列應該被清除。</p>
  </article>
</main>
</body>
</html>
