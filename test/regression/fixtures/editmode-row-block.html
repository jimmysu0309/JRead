<!DOCTYPE html>
<!--
  JRead 編輯模式「短的相異行」邊界 fixture（v0.8.111）

  仿 restofworld 文章 header 實測結構（Jimmy 2026-06-18 回報）：meta 容器內
  同層放「日期行（38 字）」+「翻譯連結（短）」兩個相異子。移除 cLen+30 絕對
  floor 前，日期行被當 meta 的純包裝、一路爬併到整個 header（點日期連刪多行）；
  純 1.3× ratio 下短的相異行各自獨立。inline 元素以 style="display:inline" 明確
  標注讓 jsdom getComputedStyle 回確定值（真瀏覽器 display 由 probe 在真站驗過）。
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"></head>
<body>
  <article id="post" data-jread-active="1">
    <div id="content" style="display:block">
      <p id="lead" style="display:block">
        這是一段足夠長的前言正文，描述文章主旨與背景脈絡，內容延伸到足以構成
        主體段落的字數，確保整篇主文有實質長度、各層文字比例正常，不會因為過短
        而讓 dominant guard 或 ratio 判斷失真。
      </p>
      <div id="header" style="display:block">
        <div id="byline" style="display:block">By <a id="author" style="display:inline" href="#">MICHAEL BELTRAN</a></div>
        <div id="meta" style="display:block">
          <div id="dateline" style="display:block"><time id="dt" style="display:inline">18 MAY 2026</time> • QUEZON CITY, PHILIPPINES</div>
          <a id="xlate" style="display:inline" href="#">翻譯成中文（簡體字）</a>
        </div>
      </div>
      <p id="body" style="display:block">
        內文第一段，論述主要觀點並提供足夠長度的文字，使其成為一個獨立而完整的
        段落，與上方 header 區塊清楚區隔。
      </p>
    </div>
  </article>
</body>
</html>
