<!DOCTYPE html>
<!--
  v1.7.41（S2）最小重現：圖說（figcaption）內容包在 <span> 裡的站點慣例。
  figcaption 本體刻意不在 styler BODY_TEXT_CORE（v0.7.120 決策：圖說保留比
  body 小的階層），但其後代 span 舊版會命中 SPAN_TEXT_SEL 被拉成 body 字級
  ——同一條圖說 span 文字 17px+、非 span 部分 11px，字級分裂。
-->
<html>
<head>
  <meta charset="utf-8">
  <title>圖說 span 字級分裂最小重現</title>
</head>
<body>
  <main>
    <article>
      <h1>測試文章標題：圖說字級不可分裂</h1>
      <p>這是第一段夠長的主文內容，包含逗號、句號等標點，足夠通過偵測器的字數門檻與主文判定，維持段落完整。</p>
      <p>主文段落裡有一個 <span id="body-span">內文 span</span>，它應該照常吃到使用者字級設定。</p>
      <figure>
        <img src="https://example.com/photo.jpg" width="800" height="500" alt="示意圖">
        <figcaption>
          <span id="caption-span">圖說文字包在 span 內</span>
          <span id="credit-span">攝影：某某人</span>
        </figcaption>
      </figure>
      <p>這是第三段主文內容，持續描述補充，維持足夠長度避免整個容器被當成空殼或雜訊處理掉。</p>
    </article>
  </main>
</body>
</html>
