<!DOCTYPE html>
<!--
  figcaption 靠尾端對齊 reset 最小重現（v1.7.19）。
  場景：存檔改寫頁把站方「hero credit 靠右」樣式 inline 化到 figcaption 上，
  reader 窄版心下 caption + credit 連排折行 → 非末行填滿、末行孤懸右緣。
  控制組：center（排版意圖）、無對齊（自然流向）、rtl 文向的 right（自然流向）
  皆不可碰；rtl 的 left（尾端）要 reset。
-->
<html>
<body>
  <main data-test="article">
    <figure>
      <img src="hero.jpg" alt="" width="608" height="400">
      <figcaption data-test="cap-right" style="text-align: right;">
        <span>Maria Rosa Mayer Munos and Ludwig Gisch</span>
        <span>Illustration: The Wall Street Journal</span>
      </figcaption>
    </figure>
    <figure>
      <img src="mid.jpg" alt="" width="608" height="400">
      <figcaption data-test="cap-center" style="text-align: center;">A centered caption kept as-is.</figcaption>
    </figure>
    <figure>
      <img src="plain.jpg" alt="" width="608" height="400">
      <figcaption data-test="cap-plain">A plain caption with no alignment.</figcaption>
    </figure>
    <figure>
      <img src="rtl-natural.jpg" alt="" width="608" height="400">
      <figcaption data-test="cap-rtl-natural" style="direction: rtl; text-align: right;">rtl 自然流向靠右，不可碰</figcaption>
    </figure>
    <figure>
      <img src="rtl-tail.jpg" alt="" width="608" height="400">
      <figcaption data-test="cap-rtl-tail" style="direction: rtl; text-align: left;">rtl 靠尾端（left），要 reset</figcaption>
    </figure>
    <p>正文段落，確保 fixture 有主文脈絡。這一段文字只是佔位，用來讓 article 結構完整一點。</p>
  </main>
</body>
</html>
