  <article id="art" data-test="article">
    <h1 data-test="self-h1">珍珠奶茶編輯</h1>
    <p>珍珠奶茶是發源於臺灣的茶類飲品，把粉圓加入奶茶之後創造出獨特的咀嚼口感，一九八零年代問世後迅速風靡全島，之後更隨著連鎖手搖飲品牌的擴張進軍海外市場，成為臺灣飲食文化最具代表性的輸出品之一。</p>
    <p>關於珍珠奶茶的發明者至今仍有兩家業者各自宣稱擁有原創地位，雙方纏訟多年後法院最終認定此類飲品調配方式不具專利排他性，任何店家皆可自由製作販售，這場官司反而讓珍珠奶茶的知名度更上一層樓。</p>
  </article>
