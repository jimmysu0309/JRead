    <h1>中科院內部自嘲淪「買辦」　合作案切忌不可因小失大</h1>
    <div class="news-box-text">
      <p>不可否認中科院在天弓、天劍系列飛彈、雷達等領域有研發出一定的成果，雖隨著國防自主政策下，電接到各軍種的訂單也增加，據了解，中科院內部卻自嘲只是買辦的角色，採購法規沒有整體配套，這是長期累積下來的結構問題。</p>
      <p>因此中科院這次與多家美商合作案中，應可從合作經驗中找出真正有意義的外購需求，遵守國際規範來洗刷過去因無法採購，採用了一些不光彩手法，讓國防自主真正的落實本土。（責任編輯：王晨芝）</p>
