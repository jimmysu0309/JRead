<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Longchamp (company) - Wikipedia</title>
  <meta property="og:title" content="Longchamp (company)">
</head>
<body>
  <!--
    Wikipedia 文章頁 minimal repro：article 內含 infobox table（td / th / caption）。
    這份 fixture 不依賴實際 CSS（jsdom 不算 cascade），forcing function 驗的是
    「styler 注入的 selector list 含 td / th / caption」這條結構性事實 +
    「fixture 內結構真實存在 td / th / caption 元素」（避免 selector 加了但實際 DOM
    結構不命中的 case）。
  -->
  <main>
    <article>
      <h1><span class="mw-page-title-main">Longchamp (company)</span></h1>
      <table class="infobox">
        <caption class="infobox-title">Longchamp SAS</caption>
        <tbody>
          <tr>
            <th class="infobox-label">公司類型</th>
            <td class="infobox-data">私人企業</td>
          </tr>
          <tr>
            <th class="infobox-label">產業</th>
            <td class="infobox-data">時尚</td>
          </tr>
          <tr>
            <th class="infobox-label">創立時間</th>
            <td class="infobox-data">1948 年，於巴黎</td>
          </tr>
          <tr>
            <th class="infobox-label">總部</th>
            <td class="infobox-data adr">法國巴黎</td>
          </tr>
        </tbody>
      </table>
      <p>Longchamp 是一家法國皮件公司，由 Jean Cassegrain 於 1948 年創立於巴黎。最初以皮革包覆煙斗起家，1970 年代轉型生產尼龍材質包袋。</p>
      <p>該公司於 1993 年推出代表性的 Le Pliage 摺疊包，成為品牌的標誌性產品。</p>
    </article>
  </main>
</body>
</html>
