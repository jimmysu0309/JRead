    <h1>史上最慢的磁碟機</h1>
    <p data-test="editor-note">編按：本文寫於 3 天前，內容已更新</p>
    <div data-test="body">
      <p data-test="p1">Commodore 1541 被公認為史上最慢的消費級磁碟機。它剛出廠時，若與 Commodore 64 連接使用，資料傳輸速度大約只有每秒 400 位元組。要填滿機器內 64 KB 的記憶體，載入一個程式竟然需要耗費超過兩分鐘的時間才能完成。</p>
