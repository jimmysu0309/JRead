<!DOCTYPE html>
<!--
  womany.net 文末塔羅 app 跨宣傳 banner 最小重現（v0.8.112）。
  banner 是 `<a class="related-block" href="/redirects/...">` 包一張 608px 促銷圖
  （文字烤進圖片、a 無文字）——結構與 lightbox 大圖連結撞型，被
  anchorIsContentImageLink 豁免而殘留。strong keyword（related-block）命中時不套豁免。
  控制組：lightbox 連結（無 keyword class）與 weak-keyword 內容圖連結不可被誤殺。
  各 img naturalWidth/Height 由 spec stub（jsdom 不算 layout）。
-->
<html>
<head><meta charset="utf-8"></head>
<body>
  <article id="story">
    <h1>凝觀自己的女性藝術家 芙烈達‧卡蘿</h1>
    <p>女人，不論心是多麼的脆弱如花心，在遭遇苦難後仍能咬著牙自我復原向前走，這段主文夠長以通過字數門檻。</p>
    <!-- 正當 lightbox 內容圖連結（無 keyword class）→ 必須保留 -->
    <a id="lightbox-link" class="photoswipe-image" href="/image-full.jpg"><img id="content-img" src="/pictures/2519/image01.jpg" alt="卡蘿與里維拉"></a>
    <p>卡蘿與丈夫里維拉的結合，曾經在外型上被戲謔的形容，這段主文維持足夠長度。</p>
    <!-- weak keyword（popup）內容圖連結 → 仍由內容圖豁免保留 -->
    <a id="weak-keyword-link" class="image-popup-vertical-fit" href="/zoom.jpg"><img id="weak-img" src="/pictures/2520/image02.jpg" alt=""></a>
    <p>結語段落，維持文章主體足夠的字數以通過 cleaner 的主文保護門檻不被誤判。</p>
    <!-- 塔羅 app 跨宣傳 banner：strong keyword related-block + redirect href + 圖片式廣告 -->
    <a id="promo-banner" class="related-block" href="/redirects/23222?ref=wa-all"><img id="promo-img" src="/d_items/23222/promo.png" alt=""></a>
  </article>
</body>
</html>
