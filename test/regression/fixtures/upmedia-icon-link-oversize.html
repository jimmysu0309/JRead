<!DOCTYPE html>
<!--
  upmedia.mg 政治版 icon 被放大 bug（2026-04-22 回報）
  ------------------------------------------------
  真實頁：https://www.upmedia.mg/tw/focus/politics/256168
  症狀：reader mode 開啟後，「新聞摘要」「辭」「AI 新聞關鍵字詞查詢」三個
        icon 退回 natural size（276x60、250x250 等），造成主文上方出現
        巨大 UI icon。
  根因：原站這三個 icon 只用 CSS 鎖 height（例如 #toggleImg { height: 32px }）、
        沒明確設 width，依賴 browser intrinsic aspect-ratio 自動算 width。
        styler 舊規則
          [data-jread-active="1"] img { max-width: 100% !important; height: auto !important; }
        的 height:auto !important 吃掉原站 height → img 退回 naturalWidth x
        naturalHeight。
  通則修法：區分 a > img（icon-link / logo / UI 按鈕圖）與其他 wrapper
        底下的 img。前者只 cap 寬度、保留原站 height；後者維持 shrink-fit。
  本 fixture 精簡到 styler spec 可驗的最小 DOM，實際 detector / cleaner
  不參與此 spec。
-->
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>upmedia icon-link oversize</title></head>
<body>
  <div id="wrapper">
    <article class="news-box">
      <h1>王鴻薇憂台灣變「性侵島」反1000印度移工</h1>
      <div class="publish">
        <div class="publish-img">
          <!-- 新聞摘要：a > img，原站 height:32px 靠 natural aspect 自動算 width -->
          <a href="/ai-summary"><img src="/images/ai-icon-05.png" alt="新聞摘要"></a>
          <!-- 「辭」：a > img，原站 width/height 都 32px -->
          <a href="/dictionary"><img id="toggleImg" src="/images/ai-icon-11.png" alt="辭"></a>
        </div>
      </div>
      <p>國民黨團今天針對勞動部引進印度移工議題開記者會。</p>
      <!-- 內文配圖：figure > img，需保持 shrink-fit 行為 -->
      <figure>
        <img src="/pic.upmedia.mg/upfile/img/2026/0413/main.webp" alt="記者會照片">
        <figcaption>（王侑聖攝）</figcaption>
      </figure>
      <p>勞動部日前宣布，今年底可望開放批次1000名印度移工來台。</p>
      <!-- 內文段落裡的圖：p > img，保持 shrink-fit -->
      <p><img src="/pic.upmedia.mg/upfile/img/2026/0422/secondary.webp" alt="次圖"></p>
    </article>
  </div>
</body>
</html>
