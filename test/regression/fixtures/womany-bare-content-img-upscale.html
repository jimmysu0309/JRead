<!DOCTYPE html>
<!--
  womany.net 卡蘿配圖「太小」最小重現（v0.8.112）。
  站點配圖是裸 <img>（非 a 包），來源解析度小（natural 285×365 portrait），
  原站以小幅放大顯示。reader 的 img:not(a>img){ width:auto } 退回 naturalWidth
  → 在 720 版心裡只佔約半寬、與 a 包大圖（填滿欄寬）視覺不一致。
  各 img 的 natural / rect 由 spec stub（jsdom 不算 layout）。
-->
<html>
<head><meta charset="utf-8"></head>
<body>
  <article>
    <h1>凝觀自己的女性藝術家 芙烈達‧卡蘿</h1>
    <p>女人，不論心是多麼的脆弱如花心，在遭遇苦難後仍能咬著牙自我復原向前走。</p>
    <!-- 裸內容配圖：natural 285×365（< 版心）→ 應標 upscale、width:100% 撐滿欄寬 -->
    <img id="bare-small-photo" src="/images/content/pictures/2519/image01.jpg" alt="卡蘿與丈夫里維拉">
    <p>卡蘿與丈夫里維拉的結合，曾經在外型上被戲謔的形容。</p>
    <!-- 裸大來源圖：natural 1200×800（>= 版心）→ 也標 upscale（width:100% 對它=cap，無害） -->
    <img id="bare-large-photo" src="/images/content/pictures/2521/image03.jpg" alt="破碎的脊柱，1944">
    <p>在這幅畫中，卡蘿坦露身體與精神的雙重痛苦。</p>
    <!-- 裸小圖（natural 100×100 < CONTENT_IMG_MIN）→ logo/badge、不標 upscale、維持原尺寸 -->
    <img id="bare-icon" src="/logo.png" alt="">
    <!-- a 包大內容圖（lightbox）→ 走 content-img 路徑、不走 upscale 支 -->
    <a href="/lightbox"><img id="linked-photo" src="/images/content/pictures/2522/image04.jpg" alt=""></a>
    <!-- 內嵌 emoji（natural 32×32）→ inline、不標 upscale -->
    <img id="inline-emoji" src="/emoji.png" alt="">
  </article>
</body>
</html>
