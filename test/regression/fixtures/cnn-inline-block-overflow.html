<!--
  Fixture: grid collapse with inline-block child must not overflow.
  Structural pattern: CNN layout__center is display:inline-block with min-width.
  When sidebar is hidden and collapseGridWithHiddenCell fires, the child gets
  width:auto + max-width:none. For inline-block, width:auto = shrink-wrap,
  and max-width:none removes all caps → overflow. Fix: max-width:100%.
-->
<html><body>
<article id="test-article">
  <h1>Test Article Title</h1>
  <!-- Grid container with hidden sidebar + inline-block main column -->
  <div class="layout-wrapper" style="display:grid; grid-template-columns:1fr 300px; width:600px;">
    <section class="layout-center" style="display:inline-block; min-width:500px;">
      <div class="article-body">
        <p>This is the main article body with enough text content to be a real paragraph. It should fill the reader card width without overflowing.</p>
        <p>Second paragraph continues with more details about the topic being discussed in this article.</p>
      </div>
    </section>
    <aside class="sidebar-col" style="width:300px;">
      <div class="sidebar-widget">
        <h3>Related Stories</h3>
        <a href="/story1">Story 1</a>
        <a href="/story2">Story 2</a>
      </div>
    </aside>
  </div>
</article>
</body></html>
