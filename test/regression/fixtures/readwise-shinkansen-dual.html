<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Shinkansen 雙語送 Readwise fixture</title></head>
<body>
  <article id="story">
    <!-- 標題：Shinkansen nodevalue-mutated 就地翻成中文（原文已不在 DOM），無 dual-source -->
    <h1 id="title" data-shinkansen-translated="1" data-shinkansen-nodevalue-mutated="1">PopSockets 全新支架超薄登場</h1>

    <!-- block 模式：原文 <p data-shinkansen-dual-source> + afterend sibling wrapper -->
    <p id="orig-block" data-shinkansen-dual-source="1">The Low-Pro is about as thick as two stacked dimes when collapsed.</p>
    <shinkansen-translation id="wrap-block" data-sk-mark="tint" data-sk-theme="light">
      <p id="inner-block">Low-Pro 在收合時的厚度約等於兩枚 10 分錢硬幣疊在一起。</p>
    </shinkansen-translation>

    <!-- blockquote 模式：同 block（sibling wrapper），inner 保留原 tag -->
    <blockquote id="orig-bq" data-shinkansen-dual-source="1">It is incredibly thin.</blockquote>
    <shinkansen-translation id="wrap-bq">
      <blockquote id="inner-bq">它薄得令人難以置信。</blockquote>
    </shinkansen-translation>

    <!-- LI append 模式：wrapper 在 original 內（li 同時含原文 text + wrapper child） -->
    <ul>
      <li id="orig-li" data-shinkansen-dual-source="1">Magnetic mounting system.<shinkansen-translation id="wrap-li"><div id="inner-li">磁吸式安裝系統。</div></shinkansen-translation></li>
    </ul>

    <!-- 未翻譯段落：無 dual-source、無 wrapper → 原樣保留 -->
    <p id="untranslated">Pricing has not been announced yet.</p>
  </article>
</body>
</html>
