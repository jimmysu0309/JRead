<!DOCTYPE html>
<!-- 翻頁模式（v0.7.227）fixture：最小主文結構（heading + 段落 + 圖片）。
     spec 驗 styler pagedMode CSS 注入 / 不注入、paged-mode 模組 install /
     uninstall 的 DOM 副作用（頁碼指示元素）。 -->
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>翻頁模式 fixture</title></head>
<body>
  <main>
    <article>
      <h1>翻頁模式測試文章</h1>
      <p>第一段內容。這是一段足夠長的主文文字，用來確保 detector 與 styler 在 jsdom 環境下能正常運作而不觸發任何空內容防衛。</p>
      <figure>
        <img src="hero.jpg" alt="測試圖片">
        <figcaption>圖說文字</figcaption>
      </figure>
      <p>第二段內容。翻頁模式下這些段落會被 CSS multi-column 切成水平頁，但 jsdom 無 layout，spec 只驗 CSS 字串與模組行為。</p>
      <p>第三段內容。結尾段落。</p>
    </article>
  </main>
</body>
</html>
