<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>ebc inline marker 廣告插播 forcing</title>
  <meta property="og:title" content="台鐵新左營站男廁小便斗驚見針孔">
</head>
<body>
  <!-- v0.7.8 ebc news.ebc.net.tw /news/society/548318 實測：主文 div
       `.article_content` 內部有「與媽祖同行！2026 遶境全攻略看東森」類
       行銷插播，wrapper class 是 `.inline_text.has_marker`。class 既無
       `ad-` 邊界也無 `promo|sponsor` 詞，NOISE_KEYWORD_RE 舊版無命中。

       通則修法：NOISE_KEYWORD_RE 加 `marker` 詞——跨站 CMS 用 `marker`
       class 命名幾乎都指「標註 / 插播 / 推薦」特殊內容（非主文）。

       Forcing：保留「marker」詞 → `.inline_text.has_marker` 被 hide；
       拿掉「marker」詞 → 此元素漏網。 -->
  <article class="article">
    <p>EBC_MAIN_MARK 台鐵新左營站驚傳偷拍案！上月有清潔人員在站內男廁打掃時，意外發現小便斗竟被裝設細微的針孔攝影機，嚇得趕緊報警。鐵路警察局獲報後，立即報請地檢署檢察官指揮偵辦。</p>

    <!-- 媽祖廣告：wrapper 含 marker class、內含 text + link + img -->
    <div class="inline_text has_marker" id="mazu-ad">
      <a href="#mazu">
        <img src="mazu.png" alt="媽祖遶境">
        <h3>與媽祖同行！2026 遶境全攻略看東森</h3>
      </a>
    </div>

    <p>EBC_MAIN_MARK 第二段主文。專案小組透過監視器畫面循線追蹤，於近日發動搜索，將一名涉有重嫌的 30 多歲高鐵男性員工逮捕到案，並在其家中查扣相關事證，全案已依法移送法辦。</p>
  </article>
</body>
</html>
