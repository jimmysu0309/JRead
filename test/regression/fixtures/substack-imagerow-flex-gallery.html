    <div class="body markup">
      <p>SUBSTACK_MARK 答應自己，把《誌村鑑5》的稿子校完，就可以寫電子報自我獎勵一下（？月初帶爸媽去看櫻花的鹿兒島行很順利，回來後一直在校稿，今天總算可以坐下來寫點東西。</p>

      <p>獨自旅行的第一日便完全沒打算，倒是前幾天和家人搭公車去仙巖園時經過鹿兒島美術館。台灣胃不舒服想喝熱湯或粥，在 Google Map 上滑到一家店叫「食堂湯湯」，距離飯店走路不用五分鐘。</p>

      <p>循地圖前往，店在一棟大樓一樓深處，即便街上遠遠就立了店招，還是需要一點勇氣探索。並起還是走過頭，透過小窗看見店主在櫃檯內才折返回去。不過在踏進去之前，我完全沒想過會是這般光景。</p>
