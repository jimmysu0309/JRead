<!DOCTYPE html>
<!--
  最小重現：eet-china 類站（無 <article>、h1 與內文為 body sibling）經 Shinkansen
  翻譯優先（translate-first）後，主標題出現「兩份」重複卡片。
  Jimmy 2026-07-02 回報 https://www.eet-china.com/news/202606304222.html
  Shinkansen 翻譯後標題重複、版面亂七八糟。

  根因（v1.6.7）：
    - h1 同時滿足兩條 promote path 的觸發條件——page-wide unique（promoteUniqueTitleH1Into）
      + 含 article-title class（promoteArticleTitleClassHeadingInto）。
    - 非翻譯頁：promoteUniqueTitleH1Into 把 clone 放 articleEl「內」，
      promoteArticleTitleClassHeadingInto 的去重 guard
      `articleEl.querySelector('[data-jread-title-clone]')` 抓得到 → skip → 單一標題。
    - 翻譯頁（本 fixture，含 data-shinkansen-translated）：placePromotedTitleClone
      改把 clone 放 articleEl「外」（前一個 sibling、標 data-jread-promoted-outside，
      避開翻譯 content guard reconcile）→ 舊 guard 只查 articleEl 內、查不到 →
      promoteArticleTitleClassHeadingInto 再 clone 一份 → 兩個 promoted-outside clone
      → 兩張標題卡。

  修法：改用 articleHasPromotedTitle helper，同時涵蓋 in-article 與翻譯頁外置兩種
  放置位置。此 fixture 是該修法的 forcing function。

  vs eet-china-translated-title.html 的關鍵差異：h1 帶 data-shinkansen-translated
  → isTranslatedPage() 為 true → 觸發外置放置路徑（重複只發生在此路徑）。
-->
<html>
<head>
  <meta charset="UTF-8">
  <title>立讯精密赴港上市募资240亿港元-电子工程专辑</title>
</head>
<body>
  <!-- h1 wrapper 是 body sibling；h1 帶 shinkansen 標記模擬翻譯優先 -->
  <div class="rowPage row-article-title" data-test="title-wrapper">
    <h1 class="article-title" data-test="h1" data-shinkansen-translated="1">立訊精密赴港上市募資 240 億港元，開啟「A+H」雙資本通道</h1>
  </div>

  <!-- articleEl 內無 h1（v0.7.141 場景）；內文段落亦標翻譯 -->
  <div class="article-text-con article_text" data-test="article-root">
    <p data-test="body-p-1" data-shinkansen-translated="1">「果鏈」廠商 Luxshare Precision 在登陸 A 股十多年後，即將再開一條國際資本通道。</p>
    <p data-test="body-p-2" data-shinkansen-translated="1">根據 6 月 30 日提交給香港交易所的公告，立訊精密計劃在港發售 3.83 億股 H 股，每股發售價不超過 63.28 港元，預計募資至多 240 億港元。</p>
    <p data-test="body-p-3" data-shinkansen-translated="1">這是立訊精密自 2010 年 9 月 15 日登陸深交所之後，首次叩開國際資本市場大門。</p>
  </div>
</body>
</html>
