  <p>在巴西待了十天，聊了二十多位当地中国人后，我们整理了八十一个只有真正落地才会知道的细节，涵盖物流、支付、招聘、税务合规与在地化营运的方方面面，希望给准备出海南美的团队一份第一手的参考资料，避免重复踩坑。</p>
  <p>三月我们去了一趟巴西，出发前一天赶上局势升级，原定经迪拜中转的航班被取消，改签绕道非洲，辗转三十多个小时才飞抵圣保罗。</p>
