<!--
  Fixture: TVBS comment-panel false positive（text-ratio guard）
  結構特徵：article 的唯一子元素 DIV.article_new 佔全部主文內容，
  底部「相關報導」區含 3+ 個相對時間戳命中 RELATIVE_TIME_RE。
  所有 <p> 都很短（模擬 UNIQLO 促銷品項列表），不觸發 layer 1/2 guard。
  修法前：整個 article_new 被當留言面板 hide → 文章空白。
  修法後：text-ratio guard（> 50%）跳過 article_new。
-->
<html><body>
<article id="test-article">
  <div class="article_new" id="article-main">
    <div class="article-title">
      <h1>UNIQLO 夏季特賣會：精選商品一覽</h1>
    </div>
    <p id="item-1">AIRism 涼感衣 NT$390 限時優惠</p>
    <p id="item-2">輕型羽絨外套 NT$990 數量有限</p>
    <p id="item-3">寬鬆直筒牛仔褲 NT$790 全店適用</p>

    <!-- 相關報導區：含 3+ 相對時間戳，觸發 RELATIVE_TIME_RE -->
    <div class="related-articles" id="related-section">
      <h3>相關報導</h3>
      <ul>
        <li><a href="/news/1">UNIQLO 全台門市地址一覽</a><span class="time">2小時前</span></li>
        <li><a href="/news/2">日本平價服飾品牌比較</a><span class="time">1天前</span></li>
        <li><a href="/news/3">夏季穿搭推薦指南</a><span class="time">3小時前</span></li>
      </ul>
    </div>
  </div>
</article>
</body></html>
