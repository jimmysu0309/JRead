<!DOCTYPE html>
<!--
  最小重現：Stratechery / WordPress block theme 自動翻譯後主標題消失
  Jimmy 2026-05-20 回報 https://stratechery.com/2026/please-listen-to-my-podcast/
  「能有通則解嗎」（v0.7.147 fallback 只處理 h1、Stratechery 沒 h1）。

  Root cause：自動翻譯改 H2 textContent 後 detector 評分變動、選了內層
  `entry-content` 為 articleEl，主標題 `<h2.wp-block-post-title>` 在外層
  sibling 被 hideAncestorSiblings hide → reader card 內無標題。

  v0.7.149 修法：cleaner 末段加 promoteArticleTitleClassHeadingInto——
  articleEl 內無 visible h1 時，page-wide 找 DOM order 第一個含 article-title
  class signal (looksLikeArticleTitleH1) 的 h1/h2/h3 candidate、clone 進
  articleEl 開頭。

  跟 promoteUniqueTitleH1Into 互補：那條只處理 h1（unique）、本條處理 h2/h3
  + class signal。跟 markPromotedTitleIfMissing 互補：那條掃 articleEl 內
  p/div/span/h5/h6，本條掃 articleEl 外的 h1/h2/h3。

  fixture 結構（簡化版實機 Stratechery DOM）：
    <main>
      <div class="wp-block-column">              <-- detector 翻譯後沒選這層
        <h2 class="wp-block-post-title">         <-- 主標題（要被 promote）
          <a>2026.12: Please Listen to My Podcast</a>
        </h2>
        ...
        <div class="entry-content                <-- 翻譯後 articleEl
                    wp-block-post-content">
          <p>主文...</p>
          <h2>section heading</h2>             <-- 內部 h2 子標
        </div>
      </div>
      <aside class="wp-block-template-part">    <-- sidebar widget
        <h2 class="wp-block-post-title">        <-- related article (不該被 promote)
          <a>Personal Day</a>
        </h2>
      </aside>
    </main>
-->
<html>
<head>
  <meta charset="UTF-8">
  <meta property="og:title" content="2026.12: Please Listen to My Podcast">
  <title>Please Listen to My Podcast – Stratechery by Ben Thompson</title>
</head>
<body>
  <main>
    <div class="wp-block-column" data-test="outer-column">
      <h2 class="wp-block-post-title" data-test="main-h2">
        <a href="/2026/please-listen-to-my-podcast/">2026.12：請聽聽我的 Podcast</a>
      </h2>

      <div class="entry-content wp-block-post-content" data-test="article-root">
        <p data-test="body-p-1">歡迎回到本週的 Stratechery！這個推送讓你能夠控制每週的 podcast 內容。本週 Sharp Tech 涵蓋 OpenAI 轉向企業市場、為什麼 AI 看起來可能像 1980 年代的 PC、AI agent 為何尚不存在、OpenClaw 證明 OpenAI 與 Anthropic 透過 harness + model 整合差異化 sustainably 是錯的、Nvidia 對 inference 的轉向，以及 Wisconsin 冬天為什麼我不介意。</p>
        <h2 data-test="section-h2">Section Heading</h2>
        <p data-test="body-p-2">section 內文段落。</p>
      </div>
    </div>

    <aside class="wp-block-template-part" data-test="sidebar-aside">
      <h2 class="wp-block-post-title" data-test="related-article-h2">
        <a href="/2026/personal-day/">個人休假日</a>
      </h2>
    </aside>
  </main>
</body>
</html>
