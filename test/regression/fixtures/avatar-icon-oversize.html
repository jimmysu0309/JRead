<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Avatar icon 被 flex layout 撐到全寬</title>
<style>
/* 原站 CSS：avatar img 設 100% 填滿 wrapper，wrapper 在 flex 容器內被撐寬。
   reader mode 下若無 size cap，naturalWidth 較大的 avatar（320×320 典型）
   會被撐到 article width，視覺破版。 */
.author-card { display: flex; width: 100%; }
.avatar-wrapper { flex: 0 0 auto; }
.author-avatar { width: 100%; height: 100%; border-radius: 50%; }
</style>
</head><body>
<main class="article-page-wrapper">
  <article>
    <h1>Avatar icon 尺寸保護測試</h1>
    <p>主文第一段。某些原站把作者頭像放在 flex layout 內，reader mode 下會被撐到全寬。</p>
    <p>主文第二段。新增 [class*="avatar" i] 規則限制 avatar 類 wrapper 內的 img 至 200px 上限。</p>

    <div class="card author-wrapper js-author-wrapper">
      <div class="card-body">
        <a class="d-flex item-link">
          <div class="avatar-wrapper ratio ratio-1x1">
            <img class="author-avatar rounded-circle"
                 src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                 width="320" height="320" alt="中央通訊社">
          </div>
          <span>中央通訊社</span>
        </a>
        <p>中央通訊社是中華民國的國家通訊社，是台灣最具影響力的新聞媒體。</p>
      </div>
    </div>

    <p>主文第三段。確認 avatar size cap 不影響主文媒體（hero figure / 內文 img）。</p>
  </article>
</main>
</body></html>
