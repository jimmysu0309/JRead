<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Bootstrap .ratio aspect-ratio hack 撐空白</title>
<style>
/* Bootstrap 5 .ratio pattern：::before 撐 padding-top 做 aspect ratio，
   子元素 position:absolute 疊在 ::before 上方。
   JRead styler 強制 img { position: static } 後，img 排在 ::before 下方，
   造成 ::before 高度變成空白。 */
.ratio { position: relative; width: 100%; }
.ratio::before { display: block; padding-top: 60%; content: ""; }
.ratio > * { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.ratio-320x192::before { padding-top: 60%; }
</style>
</head><body>
<main class="article-page-wrapper">
  <article>
    <h1>Bootstrap ratio 容器測試</h1>
    <div class="item-froms"><time>2026/01/01</time></div>
    <div class="imgs-wrapper">
      <figure>
        <div class="img-wrapper ratio ratio-320x192">
          <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
               width="600" height="360" alt="hero">
        </div>
        <figcaption>Photo Credit: test</figcaption>
      </figure>
    </div>
    <p>主文第一段。Bootstrap ratio 容器的 ::before pseudo-element 用 padding-top 撐 aspect ratio。</p>
    <p>主文第二段。JRead styler 強制 img position:static 後，img 從 absolute 變成 flow layout 排在 ::before 下方。</p>
  </article>
</main>
</body></html>
