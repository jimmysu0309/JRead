<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>內文版心自我檢查 fixture</title></head>
<body>
  <article>
    <header>
      <!-- 標題列 wrapper（roomie div.mobile-info）：帶水平 padding，內含
           sr-only 空 h1 + 非 heading 的可見標題（span）。沒有段落，沿段落鏈
           走不到此 wrapper——v0.7.247 全面遍歷才會清到。 -->
      <h1 class="sr-only" style="position:absolute;"></h1>
      <div class="title-wrap" style="padding-left: 24px; padding-right: 24px;">
        <span class="visible-title">帶我去遠得要命的城市盡頭：花 30 元玩一下午</span>
      </div>
    </header>
    <figure>
      <img src="cover.jpg" width="600" height="400" alt="封面">
      <figcaption>圖說：城市公車搭乘指南</figcaption>
    </figure>
    <!-- 窄化元兇：內文 wrapper 帶水平 padding（roomie div.content），
         card 已提供閱讀內距、此 padding 把內文壓窄到 < 版心寬。inline style
         讓 jsdom getComputedStyle 讀得到。 -->
    <div class="content" style="padding-left: 20px; padding-right: 20px;">
      <p>國中時期的我，因為越區就讀，每天早上都要搭 225 路線從三重通勤到松山，在晨間的尖峰裡，車程快的話 40 分鐘，一小時以上的也是家常便飯，常常從擠到透不過氣的滿員車廂，坐到都已人去車空還沒到站。</p>
      <p>高中時期，則是搭 262 公車，經過最繁華的市區路段，看著窗外人來人往，那是我認識這座城市的方式，也是我與這座城市最初的連結，每一段路線都是一段記憶。</p>
      <blockquote style="padding-left: 30px; padding-right: 10px;">
        <p>引言區塊的縮排是刻意的，閱讀模式必須保留，不可被版心自我檢查清零。</p>
      </blockquote>
      <ul style="padding-left: 40px;">
        <li>清單項目的縮排（padding-left）由 li bullet 對齊需要，必須保留。</li>
      </ul>
    </div>
  </article>
</body>
</html>
