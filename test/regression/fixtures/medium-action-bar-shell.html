<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <title>用 Claude 幫 Side Project 產出功能說明文件</title>
</head>
<body>
  <main>
    <article>
      <!-- 標題 + 作者 row（Medium 類版型，作者列含 Follow 按鈕） -->
      <div class="byline">
        <h1>用 Claude 幫 Side Project 產出功能說明文件</h1>
        <div class="author-info">
          <span>MEDIUM_AUTHOR_MARK ddsakura</span>
          <button>Follow</button>
          <span>5 min read · Mar 22, 2026</span>
        </div>
      </div>

      <!-- 模擬 Medium action-bar outer shell：
           - direct children 是 4 個 wrapper div（0% interactive）——v0.6.2 的
             互動比例 ratio 會把整塊排除
           - 自身 textContent 幾乎空（純 icon，無文字）
           - deep 有 4 button + 4 svg
           - 外層 border-top + border-bottom（產生兩條橫線 artifact）
           v0.6.6 會漏掉此 shell；v0.6.7 的 shell short-circuit 必須 hide
           （textContent < 20 chars 觸發 escape hatch）。 -->
      <div class="action-bar-outer" style="border-top: 1px solid; border-bottom: 1px solid;">
        <div class="clap-wrapper">
          <button><svg class="clap-icon"></svg></button>
        </div>
        <div class="comment-wrapper">
          <button><svg class="comment-icon"></svg></button>
        </div>
        <div class="bookmark-wrapper">
          <button><svg class="bookmark-icon"></svg></button>
        </div>
        <div class="more-wrapper">
          <button><svg class="more-icon"></svg></button>
        </div>
      </div>

      <!-- 對照：ChinaTalk / Substack 類 byline+actions wrapper。
           - direct children 同樣是 2 個 wrapper div（0% interactive）
           - 但 textContent 含作者名 + 日期 ~30 chars ≥ 20
           - shell short-circuit 的 escape hatch 不觸發，走原排除路徑
           - 整塊 outer wrapper 應**保留**（CHINATALK_BYLINE_MARK 可見）；
             僅內層 btn-group 被 action-row hide。 -->
      <div class="byline-actions-wrapper">
        <div class="meta-group">CHINATALK_BYLINE_MARK Jordan Schneider · Apr 21, 2026</div>
        <div class="btn-group">
          <button>Like</button>
          <button>Comment</button>
          <button>Share</button>
        </div>
      </div>

      <!-- 正常內文，避開 action-row 規則 -->
      <p>MEDIUM_MAINTEXT_MARK Side project 寫完的第一刻，聲音不出的滿足感。但接下來呢？要開發新的、還是優化舊的、還是寫成 portfolio？具實我為了增加一些外掛的手感...</p>
      <p>更多內文段落。</p>
    </article>
  </main>
</body>
</html>
