<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>JRead Touch Probe</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, system-ui, sans-serif; }
  body { background: #f0f0f0; overflow: hidden; }

  /* log overlay：固定在最上層，紅框，monospace，使用者截圖用 */
  #log {
    position: fixed; top: 0; left: 0; right: 0;
    max-height: 42vh; overflow: hidden;
    background: rgba(0,0,0,0.86); color: #0f0;
    border-bottom: 3px solid #f00;
    font: 11px/1.35 ui-monospace, Menlo, monospace;
    padding: 6px 8px; z-index: 99999; white-space: pre-wrap;
  }
  #log b { color: #ff0; }
  #log .start { color: #4cf; }
  #log .cancel { color: #f66; }
  #log .end { color: #fff; }
  #log .verdict { color: #ff0; font-weight: 700; }

  .controls {
    position: fixed; top: 42vh; left: 0; right: 0; z-index: 99999;
    display: flex; gap: 6px; padding: 6px 8px; background: #222;
    border-bottom: 2px solid #666;
  }
  .controls button {
    flex: 1; font-size: 13px; padding: 8px 4px; border: 0; border-radius: 6px;
    background: #2b6cb0; color: #fff; font-weight: 600;
  }
  .controls button.on { background: #c0392b; }

  /* 內容區：模擬閱讀卡片，可在圖片與文字上各滑一次比對 */
  .content {
    position: absolute; top: calc(42vh + 44px); left: 0; right: 0; bottom: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 12px 16px 40px;
  }
  h2 { font-size: 15px; color: #2b6cb0; margin: 14px 0 6px; }
  p { font-size: 16px; line-height: 1.7; color: #222; margin: 0 0 12px; }
  .imgzone a { display: block; }
  .imgzone img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; display: block; }
  .zone-label { font-size: 12px; color: #888; margin: 4px 0; }
</style>
</head>
<body>
<div id="log"></div>
<div class="controls">
  <button id="btnFix">套用 no-drag / no-callout（測修法）</button>
  <button id="btnClear">清空 log</button>
</div>

<div class="content">
  <p class="zone-label">① 在「可點擊圖片」上左右滑（重現 bug 的區域）：</p>
  <div class="imgzone">
    <a href="#" onclick="return false;">
      <img id="probeImg" alt="probe"
        src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' width='600' height='400'&gt;&lt;defs&gt;&lt;linearGradient id='g' x1='0' y1='0' x2='1' y2='1'&gt;&lt;stop offset='0' stop-color='%232b6cb0'/&gt;&lt;stop offset='1' stop-color='%2363b3ed'/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;&lt;rect width='600' height='400' fill='url(%23g)'/&gt;&lt;text x='300' y='210' font-size='40' fill='white' text-anchor='middle' font-family='sans-serif'&gt;CLICKABLE IMAGE&lt;/text&gt;&lt;/svg&gt;">
    </a>
  </div>

  <p class="zone-label">② 在「內文文字」上左右滑（對照組，這裡本來就能翻頁）：</p>
  <p id="probeText">國中時期的我，因為越區就讀，每天早上都要搭 225 路線從三重通勤到松山，在晨間的尖峰裡，車程快的話四十分鐘，一小時以上的也是家常便飯，常常從擠到透不過氣的滿員車廂坐到都已人去車空還沒到站。這是用來測試手指在純文字上左右滑動時，touch 事件的派發行為，與圖片區做對照。</p>

  <p class="zone-label">③ 在「裸圖片（無連結）」上滑：</p>
  <img id="probeImg2" alt="probe2" style="width:100%;height:160px;object-fit:cover;border-radius:8px;display:block;"
    src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' width='600' height='300'&gt;&lt;rect width='600' height='300' fill='%23718096'/&gt;&lt;text x='300' y='160' font-size='36' fill='white' text-anchor='middle' font-family='sans-serif'&gt;BARE IMAGE&lt;/text&gt;&lt;/svg&gt;">
</div>

<script>
// ===== JRead paged-mode swipe 判定（與 paged-mode.js 同款，inline 重現）=====
var SWIPE_MIN_DX = 48, SWIPE_AXIS_RATIO = 1.4, EDGE_GUARD_PX = 0;
function classifySwipe(g) {
  if (!g) return null;
  if (g.startX < EDGE_GUARD_PX || g.startX > g.viewportW - EDGE_GUARD_PX) return null;
  if (Math.abs(g.dx) < SWIPE_MIN_DX) return null;
  if (Math.abs(g.dx) < Math.abs(g.dy) * SWIPE_AXIS_RATIO) return null;
  return g.dx < 0 ? 'next' : 'prev';
}

// ===== log overlay =====
var logEl = document.getElementById('log');
var lines = [];
function log(html) {
  lines.push(html);
  if (lines.length > 26) lines.shift();
  logEl.innerHTML = lines.join('\n');
}
function tgt(e) {
  var t = e.target, tag = t && t.tagName ? t.tagName : '?';
  var a = t && t.closest ? (t.closest('a') ? '+a' : '') : '';
  return tag + a;
}

// ===== 同 paged-mode.js 結構的 window-capture touch listeners =====
var touchState = null, gestureSeq = [];
window.addEventListener('touchstart', function (e) {
  if (e.touches.length !== 1) { touchState = null; return; }
  var t = e.touches[0];
  touchState = { startX: t.clientX, startY: t.clientY, lastX: t.clientX, lastY: t.clientY, moves: 0, anyCancelable: false };
  gestureSeq = [];
  log('<span class="start">START</span> ' + tgt(e) + ' x=' + Math.round(t.clientX));
}, { capture: true, passive: true });

window.addEventListener('touchmove', function (e) {
  if (!touchState || e.touches.length !== 1) return;
  var t = e.touches[0];
  touchState.lastX = t.clientX; touchState.lastY = t.clientY; touchState.moves++;
  if (e.cancelable) touchState.anyCancelable = true;
  // 每 gesture 只印前 2 + 最後 1 個 move，避免洗版
  touchState._lastMoveStr = 'MOVE ' + tgt(e) + ' cancelable=' + e.cancelable + ' x=' + Math.round(t.clientX) + ' dx=' + Math.round(t.clientX - touchState.startX);
  if (touchState.moves <= 2) log('  ' + touchState._lastMoveStr);
}, { capture: true, passive: false });

function finish(kind, e) {
  if (!touchState) { log('<span class="cancel">' + kind + '</span> (無 touchState)'); return; }
  if (touchState.moves > 2) log('  …(' + touchState.moves + ' moves) 末: ' + (touchState._lastMoveStr || ''));
  var ct = e.changedTouches && e.changedTouches[0];
  // lastX（move 累積）與 changedTouches 取位移大者
  var endX = touchState.lastX, endY = touchState.lastY;
  if (ct && Math.abs(ct.clientX - touchState.startX) > Math.abs(endX - touchState.startX)) { endX = ct.clientX; endY = ct.clientY; }
  var dir = classifySwipe({ dx: endX - touchState.startX, dy: endY - touchState.startY, startX: touchState.startX, viewportW: window.innerWidth });
  var cls = kind === 'CANCEL' ? 'cancel' : 'end';
  log('<span class="' + cls + '">' + kind + '</span> ' + tgt(e) +
      ' moves=' + touchState.moves + ' anyCancelable=' + touchState.anyCancelable +
      ' ctX=' + (ct ? Math.round(ct.clientX) : 'none') +
      ' finalDx=' + Math.round(endX - touchState.startX));
  log('<span class="verdict">→ 翻頁判定: ' + (dir ? dir.toUpperCase() + ' ✅' : '✗ 無（滑不動）') + '</span>');
  touchState = null;
}
window.addEventListener('touchend', function (e) {
  if (e.touches.length > 0) { log('<span class="end">END</span> (還有 ' + e.touches.length + ' 指)'); return; }
  finish('END', e);
}, { capture: true, passive: true });
window.addEventListener('touchcancel', function (e) { finish('CANCEL', e); }, { capture: true, passive: true });

// ===== 候選修法 toggle：對所有圖片/連結套 no-drag / no-callout =====
var fixed = false;
document.getElementById('btnFix').addEventListener('click', function () {
  fixed = !fixed;
  var v = fixed ? 'none' : '';
  document.querySelectorAll('img, a').forEach(function (el) {
    el.style.webkitUserDrag = v;       // -webkit-user-drag
    el.style.webkitTouchCallout = v;   // -webkit-touch-callout
    el.style.webkitUserSelect = v;
    el.style.userSelect = v;
    if (el.tagName === 'IMG' || el.tagName === 'A') el.draggable = !fixed;
  });
  this.classList.toggle('on', fixed);
  this.textContent = fixed ? '✅ 已套修法（再滑圖片測）— 點此還原' : '套用 no-drag / no-callout（測修法）';
  log('<b>--- ' + (fixed ? '已套用 no-drag/no-callout，請再滑圖片' : '已還原原始行為') + ' ---</b>');
});
document.getElementById('btnClear').addEventListener('click', function () { lines = []; logEl.innerHTML = ''; });

log('<b>JRead Touch Probe</b> — 在①圖片 / ②文字 / ③裸圖 上各左右滑一次，截圖給 Claude');
log('viewport=' + window.innerWidth + '×' + window.innerHeight);
</script>
</body>
</html>
