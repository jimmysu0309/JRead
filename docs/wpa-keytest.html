<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JRead WPA keydown 測試</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, "PingFang TC", system-ui, sans-serif;
    background: #1a1a1a; color: #eee; line-height: 1.4;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .hint { font-size: 14px; color: #aaa; margin: 0 0 12px; }
  .hint b { color: #ffd479; }
  .counter {
    font-size: 15px; padding: 8px 12px; border-radius: 8px;
    background: #2a2a2a; margin-bottom: 12px;
  }
  .counter b { color: #7fd1ff; font-size: 20px; }
  /* 最近一次按鍵的大字摘要 */
  .latest {
    border: 2px solid #444; border-radius: 12px; padding: 16px;
    margin-bottom: 14px; background: #222;
  }
  .latest .combo { font-size: 30px; font-weight: 700; letter-spacing: 1px; }
  .latest .row { font-size: 16px; margin-top: 8px; }
  .flag { display: inline-block; padding: 2px 10px; border-radius: 6px; margin-right: 6px; font-weight: 600; }
  .flag.on  { background: #1f7a1f; color: #d8ffd8; }
  .flag.off { background: #3a3a3a; color: #888; }
  .codebox { font-family: ui-monospace, Menlo, monospace; color: #ffd479; }
  /* 歷史清單 */
  #log { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  #log .item { padding: 6px 8px; border-bottom: 1px solid #333; white-space: pre-wrap; }
  .clear { margin-top: 10px; font-size: 14px; padding: 8px 14px; border: 0; border-radius: 8px; background: #444; color: #eee; }
</style>
</head>
<body>
  <h1>JRead WPA keydown 測試</h1>
  <p class="hint">
    依序按：<b>⌥3</b>（Option+3）、<b>⌥4</b>、<b>⌥⇧3</b>、<b>⌥A</b>、<b>⌃R</b>（Control+R）。<br>
    重點看每次按鍵後 <b>alt</b> / <b>ctrl</b> 那格亮不亮、<b>code</b> 對不對。<br>
    如果按 ⌥3 後「總按鍵數」<b>沒有增加</b>，代表 Safari 根本沒把這個組合傳給網頁。
  </p>

  <div class="counter">總按鍵數（keydown）：<b id="count">0</b></div>

  <div class="latest" id="latest">
    <div class="combo" id="combo">尚未收到按鍵</div>
    <div class="row" id="flags"></div>
    <div class="row codebox" id="detail"></div>
  </div>

  <div id="log"></div>
  <button class="clear" onclick="reset()">清空</button>

<script>
  var count = 0;
  var elCount = document.getElementById('count');
  var elCombo = document.getElementById('combo');
  var elFlags = document.getElementById('flags');
  var elDetail = document.getElementById('detail');
  var elLog = document.getElementById('log');

  function flag(label, on) {
    return '<span class="flag ' + (on ? 'on' : 'off') + '">' + label + (on ? ' ✓' : ' ✗') + '</span>';
  }

  function comboStr(e) {
    var s = '';
    if (e.ctrlKey)  s += '⌃';
    if (e.altKey)   s += '⌥';
    if (e.shiftKey) s += '⇧';
    if (e.metaKey)  s += '⌘';
    return s + (e.code || e.key || '?');
  }

  // capture phase + window 層，與 content-shortcuts.js 的監聽方式一致
  window.addEventListener('keydown', function (e) {
    // 擋掉 ⌥+字 的 dead-key 字元輸入 / 瀏覽器預設動作，避免干擾
    e.preventDefault();

    count++;
    elCount.textContent = count;

    elCombo.textContent = comboStr(e);
    elFlags.innerHTML =
      flag('alt', e.altKey) +
      flag('ctrl', e.ctrlKey) +
      flag('shift', e.shiftKey) +
      flag('meta', e.metaKey);
    elDetail.textContent =
      'code=' + e.code +
      '  key=' + JSON.stringify(e.key) +
      '  keyCode=' + e.keyCode +
      '  isComposing=' + e.isComposing;

    var item = document.createElement('div');
    item.className = 'item';
    item.textContent =
      '#' + count + '  ' + comboStr(e) +
      '   alt=' + e.altKey + ' ctrl=' + e.ctrlKey + ' shift=' + e.shiftKey + ' meta=' + e.metaKey +
      '   code=' + e.code + ' key=' + JSON.stringify(e.key) + ' kc=' + e.keyCode;
    elLog.insertBefore(item, elLog.firstChild);
  }, true);

  function reset() {
    count = 0; elCount.textContent = '0';
    elCombo.textContent = '尚未收到按鍵';
    elFlags.innerHTML = ''; elDetail.textContent = '';
    elLog.innerHTML = '';
  }
</script>
</body>
</html>
