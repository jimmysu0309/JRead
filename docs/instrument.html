<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JRead 收合範圍 instrument</title>
<style>
  html, body { margin: 0; padding: 0; }
  html, body { overflow-x: hidden; overflow-y: visible; height: auto; }
  body { min-height: 150vh; background: linear-gradient(#fff, #dde, #fff); }
  #card { position: fixed; top: 0; left: 0; right: 0; bottom: 0; touch-action: pan-y; }
  #status {
    position: fixed; top: 0; left: 0; right: 0; z-index: 99999; pointer-events: none;
    border: 3px solid red; border-bottom: none; box-sizing: border-box;
    background: rgba(0,0,0,0.9); color: #fff; font: bold 15px/1.5 monospace; padding: 6px;
  }
  #btns {
    position: fixed; top: 64px; left: 0; right: 0; z-index: 99999;
    border-left: 3px solid red; border-right: 3px solid red; box-sizing: border-box;
    background: rgba(20,20,20,0.95); padding: 5px; display: flex; flex-wrap: wrap; gap: 5px;
  }
  #btns button { flex: 1 0 26%; padding: 9px 0; font: bold 14px monospace; background: #345; color: #fff; border: 1px solid #678; border-radius: 5px; }
  #btns button.on { background: #2a7; }
  #log {
    position: fixed; top: 132px; left: 0; right: 0; height: calc(52% - 132px);
    z-index: 99998; pointer-events: none;
    border: 3px solid red; border-top: none; box-sizing: border-box;
    background: rgba(0,0,0,0.85); color: #0f0; font: 11px/1.2 monospace; padding: 4px;
    white-space: pre; overflow: hidden;
  }
  #steps {
    position: fixed; top: 52%; left: 0; right: 0; z-index: 99997; pointer-events: none;
    background: rgba(0,40,90,0.92); color: #fff; font: 12px/1.35 -apple-system, monospace; padding: 7px; box-sizing: border-box;
  }
  #hint {
    position: fixed; bottom: 0; left: 0; right: 0; height: 26%;
    display: flex; align-items: center; justify-content: center;
    color: #06c; font: 15px monospace; pointer-events: none; z-index: 9999;
  }
</style>
</head>
<body>
<div id="card"></div>
<div id="hint">↑ 在這裡上滑收合 ↑</div>
<div id="steps">① 點上面數字選 min-height → ② 上滑看「工具列」收不收得了 → ③ 找出還收得了的「最小」值 → ④ 截圖（含選中的值）</div>
<div id="status"></div>
<div id="btns"></div>
<div id="log"></div>
<script>
  var card = document.getElementById('card');
  var statusEl = document.getElementById('status');
  var logEl = document.getElementById('log');
  var btnsEl = document.getElementById('btns');
  var lines = [];
  var t0 = performance.now();
  var curVH = 150;
  function ms() { return Math.round(performance.now() - t0); }
  function sy() { return Math.round(window.scrollY || window.pageYOffset || 0); }
  function maxScroll() { return Math.max(0, Math.round(document.documentElement.scrollHeight - window.innerHeight)); }
  function tb() { return window.innerHeight >= 820 ? '收合' : '展開'; }
  function renderStatus() {
    statusEl.textContent = 'min-height=' + curVH + 'vh  可捲=' + maxScroll() + 'px\nsy=' + sy() + ' iH=' + window.innerHeight + ' 工具列:' + tb();
  }
  function push(tag) {
    lines.push(ms() + ' ' + tag + ' sy=' + sy() + ' iH=' + window.innerHeight + ' ' + tb());
    if (lines.length > 16) lines.shift();
    logEl.textContent = lines.join('\n');
    renderStatus();
  }
  function setVH(v) {
    curVH = v;
    document.body.style.minHeight = v + 'vh';
    window.scrollTo(0, 0);
    [].forEach.call(btnsEl.children, function (b) { b.className = (parseInt(b.textContent) === v ? 'on' : ''); });
    lines = [];
    push('=== set ' + v + 'vh, 可捲≈' + maxScroll() + 'px ===');
  }
  [101, 110, 120, 135, 150, 250].forEach(function (v) {
    var b = document.createElement('button');
    b.textContent = v;
    b.addEventListener('click', function () { setVH(v); });
    btnsEl.appendChild(b);
  });

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
  var lastIH = window.innerHeight;
  setInterval(function () {
    renderStatus();
    if (window.innerHeight !== lastIH) { push('iH→' + window.innerHeight); lastIH = window.innerHeight; }
  }, 150);
  setVH(150);
</script>
</body>
</html>
