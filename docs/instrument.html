<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JRead 收合鎖測試台</title>
<style>
  html, body { margin: 0; padding: 0; }
  html, body { overflow-x: hidden; overflow-y: visible; height: auto; }
  body { min-height: 500vh; background: linear-gradient(#fff, #dde, #fff); }
  #card { position: fixed; top: 0; left: 0; right: 0; bottom: 0; touch-action: pan-y; }
  #status {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 99999; pointer-events: none;
    border: 3px solid red; border-bottom: none; box-sizing: border-box;
    background: rgba(0,0,0,0.9); color: #fff; font: bold 15px/1.5 monospace; padding: 6px;
  }
  #log {
    position: fixed; top: 64px; left: 0; right: 0; height: calc(52% - 64px);
    z-index: 99999; pointer-events: none;
    border: 3px solid red; border-top: none; box-sizing: border-box;
    background: rgba(0,0,0,0.85); color: #0f0; font: 11px/1.2 monospace; padding: 4px;
    white-space: pre; overflow: hidden;
  }
  #steps {
    position: fixed; top: 52%; left: 0; right: 0;
    z-index: 99999; pointer-events: none;
    background: rgba(0,40,90,0.92); color: #fff; font: 12px/1.35 -apple-system, monospace; padding: 7px;
    box-sizing: border-box;
  }
  /* RESET 按鈕：可點，重置 vLocked + 回頂 */
  #reset {
    position: fixed; bottom: 0; left: 0; right: 0; height: 16%;
    display: flex; align-items: center; justify-content: center;
    background: #822; color: #fff; font: bold 16px monospace; z-index: 99999;
  }
  #hint {
    position: fixed; bottom: 16%; left: 0; right: 0; height: 24%;
    display: flex; align-items: center; justify-content: center;
    color: #06c; font: 15px monospace; pointer-events: none; z-index: 9999;
  }
</style>
</head>
<body>
<div id="card"></div>
<div id="hint">↑ 在這裡上滑 / 下滑 ↑</div>
<div id="reset">⟳ 點這裡 RESET（解鎖 + 回頂）</div>
<div id="steps">① 上滑收合工具列（vLocked 應變 true）→ ② 鎖住後試「下滑」想叫回工具列 → ③ 看工具列有沒有被叫回來 + 截圖紅框</div>
<div id="status"></div>
<div id="log"></div>
<script>
  var SCROLL_LOCK_PX = 100;
  var HMOVE_BLOCK_PX = 6;
  var vLocked = false;
  var touchState = null;
  var card = document.getElementById('card');
  var statusEl = document.getElementById('status');
  var logEl = document.getElementById('log');
  var lines = [];
  var t0 = performance.now();
  function ms() { return Math.round(performance.now() - t0); }
  function vvH() { return window.visualViewport ? Math.round(window.visualViewport.height) : -1; }
  function sy() { return Math.round(window.scrollY || window.pageYOffset || 0); }
  function renderStatus() {
    statusEl.textContent = 'vLocked=' + vLocked + '  sy=' + sy() + '\niH=' + window.innerHeight + ' vvH=' + vvH() + ' (工具列:' + (window.innerHeight >= 820 ? '收合' : '展開') + ')';
  }
  function push(tag, extra) {
    lines.push(ms() + ' ' + tag + ' sy=' + sy() + ' iH=' + window.innerHeight + (extra ? ' ' + extra : ''));
    if (lines.length > 22) lines.shift();
    logEl.textContent = lines.join('\n');
    renderStatus();
  }

  // === 複製 JRead 鎖邏輯 ===
  function applyVLock() {
    if (vLocked) return;
    vLocked = true;
    card.style.setProperty('touch-action', 'none', 'important');
    push('*** vLocked=TRUE ***', '(touch-action:none)');
  }
  function checkScrollLock() {
    if (vLocked || touchState) return;
    if (sy() > SCROLL_LOCK_PX) applyVLock();
  }

  window.addEventListener('scroll', function () {
    checkScrollLock();
  }, { passive: true });

  window.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { touchState = null; return; }
    var t = e.touches[0];
    touchState = { x: t.clientX, y: t.clientY };
    push('TSTART', 'cancelable=' + e.cancelable);
  }, { capture: true, passive: true });

  var lastC = null;
  window.addEventListener('touchmove', function (e) {
    if (!touchState) return;
    if (e.touches.length !== 1) { touchState = null; return; }
    var t = e.touches[0];
    var dx = t.clientX - touchState.x, dy = t.clientY - touchState.y;
    // JRead onTouchMove 邏輯：vLocked 擋全部；第一頁只擋水平
    var block = vLocked || (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > HMOVE_BLOCK_PX);
    var acted = 'no';
    if (block) {
      if (e.cancelable) { e.preventDefault(); acted = 'preventDefault'; }
      else { acted = 'CANT(noncancelable)'; }
    }
    if (e.cancelable !== lastC) {
      push('TMOVE c=>' + e.cancelable, 'block=' + block + ' act=' + acted);
      lastC = e.cancelable;
    }
  }, { capture: true, passive: false });

  window.addEventListener('touchend', function (e) {
    touchState = null;
    checkScrollLock();
    push('TEND', 'vLocked=' + vLocked);
    lastC = null;
  }, { capture: true, passive: true });

  // RESET
  document.getElementById('reset').addEventListener('click', function () {
    vLocked = false;
    card.style.removeProperty('touch-action');
    window.scrollTo(0, 0);
    lines = [];
    push('=== RESET ===', '');
  });

  push('INIT', '');
  setInterval(renderStatus, 200);
</script>
</body>
</html>
