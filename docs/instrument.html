<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JRead 收合後鎖測試（101vh + 停止後鎖）</title>
<style>
  html, body { margin: 0; padding: 0; }
  html, body { overflow-x: hidden; overflow-y: visible; height: auto; }
  body { min-height: 101vh; background: linear-gradient(#fff, #dde, #fff); }
  #card { position: fixed; top: 0; left: 0; right: 0; bottom: 0; touch-action: pan-y; }
  #status {
    position: fixed; top: 0; left: 0; right: 0; z-index: 99999; pointer-events: none;
    border: 3px solid red; border-bottom: none; box-sizing: border-box;
    background: rgba(0,0,0,0.9); color: #fff; font: bold 15px/1.5 monospace; padding: 6px;
  }
  #log {
    position: fixed; top: 64px; left: 0; right: 0; height: calc(50% - 64px);
    z-index: 99999; pointer-events: none;
    border: 3px solid red; border-top: none; box-sizing: border-box;
    background: rgba(0,0,0,0.85); color: #0f0; font: 11px/1.2 monospace; padding: 4px;
    white-space: pre; overflow: hidden;
  }
  #steps {
    position: fixed; top: 50%; left: 0; right: 0; z-index: 99999; pointer-events: none;
    background: rgba(0,40,90,0.92); color: #fff; font: 12px/1.35 -apple-system, monospace; padding: 7px; box-sizing: border-box;
  }
  #reset {
    position: fixed; bottom: 0; left: 0; right: 0; height: 16%;
    display: flex; align-items: center; justify-content: center;
    background: #822; color: #fff; font: bold 16px monospace; z-index: 99999;
  }
  #hint {
    position: fixed; bottom: 16%; left: 0; right: 0; height: 22%;
    display: flex; align-items: center; justify-content: center;
    color: #06c; font: 14px monospace; pointer-events: none; z-index: 9999;
  }
</style>
</head>
<body>
<div id="card"></div>
<div id="hint">↑ 上滑收合，再下滑試解鎖 ↑</div>
<div id="reset">⟳ RESET（解鎖 + 回頂）</div>
<div id="steps">101vh + 捲動「停止後」才鎖。① 上滑收合 → ② 看是否鎖（vLocked=true）且工具列維持「收合」不彈回 → ③ 下滑試：是否被擋住、工具列是否維持收合 → ④ 截圖</div>
<div id="status"></div>
<div id="log"></div>
<script>
  var vLocked = false;
  var touchState = null;
  var settleTimer = null;
  var card = document.getElementById('card');
  var statusEl = document.getElementById('status');
  var logEl = document.getElementById('log');
  var lines = [];
  var t0 = performance.now();
  function ms() { return Math.round(performance.now() - t0); }
  function sy() { return Math.round(window.scrollY || window.pageYOffset || 0); }
  function tb() { return window.innerHeight >= 820 ? '收合' : '展開'; }
  function renderStatus() {
    statusEl.textContent = 'vLocked=' + vLocked + ' sy=' + sy() + '\niH=' + window.innerHeight + ' 工具列:' + tb();
  }
  function push(tag) {
    lines.push(ms() + ' ' + tag + ' sy=' + sy() + ' iH=' + window.innerHeight + ' ' + tb());
    if (lines.length > 18) lines.shift();
    logEl.textContent = lines.join('\n');
    renderStatus();
  }
  function applyVLock() {
    if (vLocked) return;
    vLocked = true;
    card.style.setProperty('touch-action', 'none', 'important');
    push('*** LOCK（停止後）***');
  }
  // 捲動「停止後」才鎖：每次 scroll 重設 250ms timer；250ms 內沒再 scroll = 捲軸消失 = 停止。
  // 停止時若已捲離頂端（sy>2 = 已收合）且手指不在 → 上鎖（無慣性可打斷、不會彈回）。
  function onScroll() {
    if (vLocked) return;
    if (settleTimer) clearTimeout(settleTimer);
    settleTimer = setTimeout(function () {
      if (vLocked || touchState) return;
      if (sy() > 2) { push('settle sy=' + sy()); applyVLock(); }
    }, 250);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { touchState = null; return; }
    var t = e.touches[0]; touchState = { x: t.clientX, y: t.clientY };
    push('TSTART c=' + e.cancelable);
  }, { capture: true, passive: true });
  var lastC = null;
  window.addEventListener('touchmove', function (e) {
    if (!touchState) return;
    var blocked = 'no';
    if (vLocked) {
      if (e.cancelable) { e.preventDefault(); blocked = 'preventDefault'; }
      else blocked = 'CANT(noncancelable)';
    }
    if (e.cancelable !== lastC) { push('TMOVE c=>' + e.cancelable + ' blk=' + blocked); lastC = e.cancelable; }
  }, { capture: true, passive: false });
  window.addEventListener('touchend', function (e) {
    touchState = null; lastC = null; push('TEND'); onScroll();
  }, { capture: true, passive: true });
  document.getElementById('reset').addEventListener('click', function () {
    vLocked = false; card.style.removeProperty('touch-action'); window.scrollTo(0, 0);
    lines = []; push('=== RESET ===');
  });

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
  var lastIH = window.innerHeight;
  setInterval(function () {
    renderStatus();
    if (window.innerHeight !== lastIH) { push('iH→' + window.innerHeight); lastIH = window.innerHeight; }
  }, 150);
  push('INIT 101vh 可捲≈' + Math.max(0, document.documentElement.scrollHeight - window.innerHeight) + 'px');
</script>
</body>
</html>
