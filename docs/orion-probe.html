<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- 關鍵：viewport-fit=cover 才會讓 env(safe-area-inset-*) 吐出非零值。
     這張頁要驗的就是「Orion 在 cover 下到底吐不吐 inset-top」。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orion safe-area 探針</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #fff; color: #111; font: 17px/1.5 -apple-system, sans-serif; }
  /* 頂端紅色 band：高度 = env(safe-area-inset-top)。
     若 Orion 有吐 inset → 出現紅色長條把下面內容推下來、肉眼可見。
     若沒吐 → 紅 band 高 0、看不到。 */
  #safeband {
    height: env(safe-area-inset-top, 0px);
    background: #e11;
    width: 100%;
  }
  /* 量測用隱形 probe：padding 全部吃 env，JS 讀 computed 值 */
  #probe {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    position: absolute; visibility: hidden; pointer-events: none;
  }
  #title {
    background: #111; color: #fff; font-weight: 700; font-size: 22px;
    padding: 10px 16px;
  }
  table { border-collapse: collapse; width: 100%; }
  td { border-bottom: 1px solid #ddd; padding: 8px 16px; vertical-align: top; }
  td.k { color: #666; width: 42%; }
  td.v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .hi { color: #e11; }
  #note { padding: 14px 16px; color: #666; font-size: 14px; }
  #fixedmark {
    position: fixed; top: 0; left: 0; right: 0; z-index: 99;
    background: #06c; color: #fff; font-weight: 700; font-size: 15px;
    padding: 6px 16px; text-align: center;
  }
  #tail { height: 200vh; padding: 16px; color: #999; }
</style>
</head>
<body>
<!-- 直接演示「fixed top:0 被島蓋」——JReader reader card 就是這樣定位。
     捲動時這條釘在最上緣不動，看 Orion 有沒有讓它鑽進 Dynamic Island 下。 -->
<div id="fixedmark">fixed top:0 ← 捲動時看我被島蓋住嗎</div>
<div id="safeband"></div>
<!-- 這行標題故意頂到 band 正下方，模擬 JReader 標題位置。
     在 Orion 若 band 高 0 → 這行會被 Dynamic Island 蓋住（重現 bug）。 -->
<div id="title">標題測試行 ← 看我有沒有被島蓋住</div>
<div id="probe"></div>
<table id="out"></table>
<div id="note">
  紅色長條 = env(safe-area-inset-top)。有出現紅條把標題推下來 → 結構性修法成立；
  紅條高 0、標題仍被島蓋住 → Orion 不吐 inset、只能偵測 Orion。請整張截圖回傳。
</div>
<div id="tail">↓ 往下捲一點，看上方藍色「fixed top:0」條會不會鑽到島下被蓋住，截一張捲動後的圖。下方留白只是讓頁面可捲。</div>
<script>
  function px(el, prop) {
    return getComputedStyle(el)[prop];
  }
  var probe = document.getElementById('probe');
  var vv = window.visualViewport || {};
  var rows = [
    ['UA 含 "Orion"?', /Orion/i.test(navigator.userAgent) ? '是 ✅' : '否 ❌', /Orion/i.test(navigator.userAgent)],
    ['safe-area-inset-top', px(probe, 'paddingTop'), parseFloat(px(probe,'paddingTop')) > 0],
    ['safe-area-inset-bottom', px(probe, 'paddingBottom'), false],
    ['safe-area-inset-left', px(probe, 'paddingLeft'), false],
    ['safe-area-inset-right', px(probe, 'paddingRight'), false],
    ['window.innerHeight', window.innerHeight + 'px', false],
    ['screen.height', screen.height + 'px', false],
    ['visualViewport.offsetTop', (vv.offsetTop != null ? vv.offsetTop : '—') + 'px', false],
    ['visualViewport.height', (vv.height != null ? Math.round(vv.height) : '—') + 'px', false],
    ['devicePixelRatio', String(window.devicePixelRatio), false],
    ['userAgent（全文）', navigator.userAgent, false],
  ];
  // ── 指紋區：找 Safari 沒有、Orion 有的特徵當偵測點 ──
  function glRenderer() {
    try {
      var c = document.createElement('canvas');
      var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
      if (!gl) return '—';
      var ext = gl.getExtension('WEBGL_debug_renderer_info');
      return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'no-ext';
    } catch (e) { return 'err'; }
  }
  function winKeys() {
    var hits = [];
    try {
      for (var k in window) { if (/orion|kagi/i.test(k)) hits.push(k); }
    } catch (e) {}
    return hits.length ? hits.join(', ') : '（無）';
  }
  function whKeys() {
    try {
      var mh = window.webkit && window.webkit.messageHandlers;
      if (!mh) return '—';
      var ks = [];
      for (var k in mh) ks.push(k);
      return ks.length ? ks.join(', ') : '（空）';
    } catch (e) { return 'err'; }
  }
  rows.push(['navigator.vendor', navigator.vendor || '（空）', false]);
  rows.push(['navigator.standalone', String(navigator.standalone), false]);
  rows.push(['navigator.maxTouchPoints', String(navigator.maxTouchPoints), false]);
  rows.push(['PushManager 支援', ('PushManager' in window) ? '有 ⚑' : '無', ('PushManager' in window)]);
  rows.push(['Notification 支援', ('Notification' in window) ? '有 ⚑' : '無', ('Notification' in window)]);
  rows.push(['userAgentData', (navigator.userAgentData ? '有 ⚑' : 'undefined'), !!navigator.userAgentData]);
  rows.push(['WebGL renderer', glRenderer(), false]);
  rows.push(['window 含 orion/kagi key', winKeys(), winKeys() !== '（無）']);
  rows.push(['webkit.messageHandlers', whKeys(), false]);

  var html = '<tr><td class="k" colspan="2" style="background:#111;color:#fff;font-weight:700">Orion safe-area + 指紋探針 v2</td></tr>';
  for (var i = 0; i < rows.length; i++) {
    var hi = rows[i][2] ? ' hi' : '';
    html += '<tr><td class="k">' + rows[i][0] + '</td><td class="v' + hi + '" style="word-break:break-all">' + rows[i][1] + '</td></tr>';
  }
  document.getElementById('out').innerHTML = html;
</script>
</body>
</html>
