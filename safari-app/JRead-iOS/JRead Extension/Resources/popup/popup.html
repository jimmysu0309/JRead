<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- iOS sheet / popover 排版基準：明寫 device-width 防 980px 預設
       layout viewport fallback；桌面 popup 視窗忽略此 meta（v0.7.222） -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JRead</title>
  <style>
    /* ==========================================================
       JRead Design Tokens (inlined — standalone popup)
       ========================================================== */
    :root {
      /* Brand blue — the only chromatic accent */
      --jr-primary-50:  #ebf4ff;
      --jr-primary-600: #2b6cb0;
      --jr-primary-700: #2c5282;

      /* Neutrals */
      --jr-neutral-50:  #fafafa;
      --jr-neutral-100: #f0f0f0;
      --jr-neutral-300: #cccccc;
      --jr-neutral-500: #888888;
      --jr-neutral-700: #444444;
      --jr-neutral-900: #222222;

      --jr-surface:     #ffffff;

      /* Danger */
      --jr-danger-text: #c53030;
      --jr-danger-bg:   #fff5f5;

      /* Reading themes — WYSIWYG swatches */
      --jr-read-light-bg:   #ffffff;
      --jr-read-light-fg:   #222222;
      --jr-read-dark-bg:    #4a494d;
      --jr-read-dark-fg:    #ecebf1;
      --jr-read-sepia-bg:   #eee2cb;
      --jr-read-sepia-fg:   #000000;
      --jr-read-gray-bg:    #ededed;
      --jr-read-gray-fg:    #000000;

      /* Type stacks */
      --jr-font-ui:      system-ui, -apple-system, "Noto Sans TC", sans-serif;
      --jr-font-reading: "Noto Serif TC", Georgia, "Times New Roman", serif;
      --jr-font-mono:    ui-monospace, Menlo, Consolas, monospace;

      /* Spacing */
      --jr-space-1: 4px;
      --jr-space-2: 8px;
      --jr-space-3: 12px;
      --jr-space-4: 16px;
      --jr-space-6: 24px;

      /* Radius */
      --jr-radius-sm: 4px;
      --jr-radius-md: 6px;
    }

    /* ==========================================================
       內嵌拉丁字型 @font-face（v0.8.147）——「英文字型」select 預覽用。
       popup 是獨立頁面、跟內文 styler 那份 @font-face 不共用，要自帶一份。
       relative URL 從 popup/ 指到 assets/fonts/；font-display: swap + lazy-load
       ——只有 select 顯示值實際引用該 family 時才下載（選系統字 / 預設時零成本）。
       weight range = 各字型真實 fvar wght 軸（可變字型，與 styler 端一致）。
       ========================================================== */
    @font-face { font-family: "Source Serif";  font-weight: 200 900; font-display: swap; src: url("../assets/fonts/source-serif.woff2") format("woff2"); }
    @font-face { font-family: "Piazzolla";     font-weight: 100 900; font-display: swap; src: url("../assets/fonts/piazzolla.woff2")    format("woff2"); }
    @font-face { font-family: "Public Sans";   font-weight: 100 900; font-display: swap; src: url("../assets/fonts/public-sans.woff2")  format("woff2"); }
    @font-face { font-family: "Source Sans";   font-weight: 200 900; font-display: swap; src: url("../assets/fonts/source-sans.woff2")  format("woff2"); }

    /* ==========================================================
       Base
       ========================================================== */
    * { box-sizing: border-box; }
    html { font-family: var(--jr-font-ui); font-size: 14px; color: var(--jr-neutral-900); }
    body {
      width: 300px;
      margin: 0;
      /* v0.7.248：垂直 padding 16→12，水平維持 16。全展開內容（10 設定列 +
         2 按鈕 + footer）原 623px 超過瀏覽器 popup ~600px 高度上限 → 出捲軸
         （Chrome / Safari 通用上限；macOS Safari 回報）。配合下方設定列間距
         與 section margin 收斂，把全展開內容壓到 ~570px < 上限、消捲軸。 */
      padding: var(--jr-space-3) var(--jr-space-4);
      background: var(--jr-surface);
      -webkit-font-smoothing: antialiased;
    }
    /* iOS / iPadOS sheet・popover（v0.7.222）：iPhone 的 popup 是整螢幕寬
       sheet、iPad 是 OS 固定寬 popover——viewport 由 OS 給定，不像
       Chrome / macOS Safari 會把 popup 視窗縮到 body 的 300px。
       結構條件：觸控環境（pointer: coarse）+ viewport 已寬於設計寬
       （min-width guard 排除 content-sized popup 視窗，避免 width: auto
       與視窗 sizing 互相循環）→ body 撐滿可用寬度、過寬時置中。 */
    @media (pointer: coarse) and (min-width: 340px) {
      body {
        width: auto;
        max-width: 560px;
        margin: 0 auto;
        /* v0.7.223：iOS 字級偏小——整體 zoom 放大（用 zoom 而非 rem 重構：
           等比放大觸控目標 + 保留既有對齊 grid 的 px 等式，fixed width
           元件比例不破）。
           v0.7.226：1.2 → 1.35（base 14px → ~19px）。1.2x 後 Jimmy iPhone
           實機回報仍偏小，再放大一檔。 */
        zoom: 1.35;
      }
      /* iPad（device-ipad，popup.js 依螢幕短邊 ≥ 600 + 觸控標記）：工具列圖示的
         popover 高度由 OS 固定、裝不下 12 設定列的全展開內容（zoom 1.35 下 ~845px），
         底部「此網域自動啟動 / 進階設定」被切（Jimmy 2026-06-22 iPad 截圖）。zoom 與
         popover sizing 不一致時溢出部分不捲動、直接截斷。iPhone 是整螢幕底部 sheet、
         空間較足，維持 1.35 readability、不套此區塊。修法：iPad 降 zoom 1.35→1.2 +
         收斂垂直節奏，把全展開壓到 ~700px 落進 popover（Shinkansen v1.10.41 同款
         「OS 固定高度只能壓矮內容適配」）。 */
      body.device-ipad { zoom: 1.2; }
      body.device-ipad .brand { margin-bottom: 6px; }
      body.device-ipad #toggle-btn,
      body.device-ipad #readwise-btn,
      body.device-ipad #edit-btn,
      body.device-ipad #borderless-btn {
        margin-bottom: 8px;
        padding-top: 6px;
        padding-bottom: 6px;
      }
      body.device-ipad .settings { margin-top: 8px; padding-top: 8px; }
      body.device-ipad .setting-row { margin-bottom: 4px; min-height: 22px; }
    }

    /* ==========================================================
       Header — logomark + wordmark + version
       ========================================================== */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      /* v0.8.166：12→8（popup 高度收斂，見 .setting-row 註解） */
      margin-bottom: var(--jr-space-2);
    }
    .logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      background: var(--jr-primary-600);
      border-radius: var(--jr-radius-md);
      display: grid;
      place-items: center;
      color: #fff;
      font-family: var(--jr-font-reading);
      font-weight: 600;
      font-size: 18px;
      line-height: 1;
      letter-spacing: -0.02em;
      /* tiny optical shift so the J sits centered */
      padding-right: 2px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.005em;
      color: var(--jr-neutral-900);
    }
    .version {
      margin-left: auto;
      font-family: var(--jr-font-mono);
      font-size: 10px;
      color: var(--jr-neutral-500);
      letter-spacing: 0.04em;
      padding-top: 1px;
    }

    /* ==========================================================
       Status (error)
       ========================================================== */
    #status {
      background: var(--jr-danger-bg);
      color: var(--jr-danger-text);
      padding: var(--jr-space-2) var(--jr-space-3);
      border-radius: var(--jr-radius-sm);
      margin-bottom: var(--jr-space-3);
      font-size: 12px;
      line-height: 1.5;
    }

    /* ==========================================================
       Primary CTA — toggle
       ========================================================== */
    #toggle-btn {
      width: 100%;
      /* v0.8.166：垂直 padding 10→8（popup 高度收斂，見 .setting-row 註解） */
      padding: 8px 14px;
      font-family: var(--jr-font-ui);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--jr-primary-600);
      border-radius: var(--jr-radius-md);
      background: var(--jr-primary-600);
      color: #fff;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
      letter-spacing: 0.01em;
    }
    #toggle-btn:hover {
      background: var(--jr-primary-700);
      border-color: var(--jr-primary-700);
    }
    #toggle-btn:active { transform: translateY(0.5px); }
    #toggle-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--jr-primary-50);
    }

    /* ==========================================================
       Secondary CTA — YouTube Borderless（v0.7.134）/ Readwise
       兩顆共用次級按鈕樣式：白底 / 灰邊 / 黑字
       ========================================================== */
    #reader-btn,
    #borderless-btn,
    #readwise-btn,
    #edit-btn {
      width: 100%;
      /* v0.8.166：margin-top 8→6、垂直 padding 9→8（popup 高度收斂） */
      margin-top: var(--jr-space-1);
      padding: 8px 14px;
      font-family: var(--jr-font-ui);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--jr-neutral-300);
      border-radius: var(--jr-radius-md);
      background: var(--jr-surface);
      color: var(--jr-neutral-900);
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      letter-spacing: 0.01em;
    }
    #reader-btn:hover:not(:disabled),
    #borderless-btn:hover:not(:disabled),
    #readwise-btn:hover:not(:disabled),
    #edit-btn:hover:not(:disabled) {
      background: var(--jr-neutral-50);
      border-color: var(--jr-neutral-500);
    }
    #reader-btn:focus-visible,
    #borderless-btn:focus-visible,
    #readwise-btn:focus-visible,
    #edit-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--jr-primary-50);
    }
    #borderless-btn:disabled,
    #readwise-btn:disabled {
      color: var(--jr-neutral-500);
      background: var(--jr-neutral-50);
      border-color: var(--jr-neutral-100);
      cursor: not-allowed;
    }
    #readwise-status {
      margin-top: var(--jr-space-2);
      font-size: 12px;
      line-height: 1.5;
      padding: var(--jr-space-2) var(--jr-space-3);
      border-radius: var(--jr-radius-sm);
    }
    #readwise-status.ok {
      background: #f0fff4;
      color: #2f855a;
    }
    #readwise-status.err {
      background: var(--jr-danger-bg);
      color: var(--jr-danger-text);
    }
    #readwise-status.info {
      background: var(--jr-primary-50);
      color: var(--jr-primary-700);
    }

    /* ==========================================================
       Settings section
       ========================================================== */
    .settings {
      /* v0.7.248：margin-top 16→12（popup 高度收斂）。v0.8.166：12→8（同上收斂） */
      margin-top: var(--jr-space-2);
      padding-top: var(--jr-space-2);
      border-top: 1px solid var(--jr-neutral-100);
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      /* v0.7.248：列間距 12→8（popup 高度收斂主力）。v0.8.158：新增「標題字級」列
         後再收斂 8→6 + min-height 28→26。v0.8.166：再新增「段落間距」列 + 第三顆按鈕
         （送 Readwise / 編輯模式同時顯示）後全展開達 629px、底部「進階設定」footer 被
         Chrome popup ~600px 上限切掉（Jimmy 2026-06-23 截圖）；列間距 6→4 + min-height
         26→24 + 下方各 section margin / 按鈕 padding 收斂，壓回 ~575px < 上限、消捲軸。 */
      margin-bottom: 4px;
      min-height: 24px;
    }
    .setting-row:last-child { margin-bottom: 0; }
    /* v0.7.237：.setting-row 的 display:flex（author origin）會蓋過 [hidden]
       屬性的 UA `display:none`（author > UA origin，與 specificity 無關）——
       不補這條，JS 對 setting-row 設 `.hidden = true` 完全無效（page-number-row
       依 pagedMode 顯隱、auto-domain-row 在無 host 頁面隱藏都靠此屬性）。
       !important 確保贏過 display:flex。 */
    .setting-row[hidden] { display: none !important; }
    .setting-row > label {
      font-size: 13px;
      color: var(--jr-neutral-700);
    }

    /* ==========================================================
       Theme group — WYSIWYG
       ========================================================== */
    .theme-group {
      display: flex;
      /* 對齊下方 stepper 總寬（26 + 56 + 26 + 2 border = 110px），使用
         space-between 讓按鈕撐開到同寬 row。字重組 3 顆維持 32px、space-between
         自然產生間隔。 */
      width: 110px;
      justify-content: space-between;
    }
    /* 主題組 4 顆（亮/暗/米/灰）：4×32=128 > 110、space-between 會被擠到零間隔。
       改 gap + flex 等分——4 顆等寬 (110-3×6)/4≈23px、彼此 6px 間隔，左右邊緣
       仍對齊 110px stepper。只 scope 主題組，不影響字重組。 */
    .theme-group[aria-label="主題"] {
      gap: 6px;
    }
    .theme-group[aria-label="主題"] .theme-btn {
      flex: 1 1 0;
      width: auto;
    }
    .theme-btn {
      width: 32px;
      /* v0.8.166：列控制項高度 28→26（含 stepper / auto-btn / select 同步，維持
         同列控制項等高對齊；popup 全展開 12 列收斂高度，見 .setting-row 註解） */
      height: 26px;
      padding: 0;
      border-radius: var(--jr-radius-sm);
      cursor: pointer;
      font-family: var(--jr-font-ui);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      transition: transform 0.1s ease, box-shadow 0.12s ease;
      /* outer "ring" area reserved so active state lands on-grid */
      border: 1px solid var(--jr-neutral-300);
    }
    .theme-btn[data-theme="light"] { background: var(--jr-read-light-bg); color: var(--jr-read-light-fg); }
    .theme-btn[data-theme="dark"]  { background: var(--jr-read-dark-bg);  color: var(--jr-read-dark-fg);  border-color: var(--jr-read-dark-bg); }
    .theme-btn[data-theme="sepia"] { background: var(--jr-read-sepia-bg); color: var(--jr-read-sepia-fg); border-color: #e4d9bf; }
    .theme-btn[data-theme="gray"]  { background: var(--jr-read-gray-bg);  color: var(--jr-read-gray-fg);  border-color: #d8d8d8; }

    .theme-btn:hover { transform: translateY(-0.5px); }
    .theme-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--jr-primary-50); }

    .theme-btn.active {
      box-shadow: 0 0 0 2px var(--jr-primary-600);
      border-color: transparent;
    }

    /* ==========================================================
       Stepper (− value +) — shared
       ========================================================== */
    .stepper {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid var(--jr-neutral-300);
      border-radius: var(--jr-radius-sm);
      background: var(--jr-surface);
      overflow: hidden;
      height: 26px; /* v0.8.166：28→26，與 theme-btn / auto-btn / select 同步等高 */
    }
    .stepper button {
      width: 26px;
      height: 100%;
      border: 0;
      background: var(--jr-neutral-50);
      cursor: pointer;
      font-family: var(--jr-font-ui);
      font-size: 14px;
      line-height: 1;
      color: var(--jr-neutral-700);
      padding: 0;
      transition: background 0.1s ease, color 0.1s ease;
    }
    .stepper button:hover { background: var(--jr-neutral-100); color: var(--jr-neutral-900); }
    .stepper button:active { background: var(--jr-neutral-300); }
    .stepper button:focus-visible {
      outline: none;
      background: var(--jr-primary-50);
      color: var(--jr-primary-700);
    }
    .stepper button:disabled {
      color: var(--jr-neutral-300);
      background: var(--jr-neutral-50);
      cursor: not-allowed;
    }
    .stepper .val {
      width: 56px;
      padding: 0;
      text-align: center;
      font-family: var(--jr-font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      line-height: 26px;
      color: var(--jr-neutral-900);
      border-left: 1px solid var(--jr-neutral-300);
      border-right: 1px solid var(--jr-neutral-300);
      background: var(--jr-surface);
      flex: 0 0 auto;
    }

    /* ==========================================================
       Font-family select — 對齊其他 row 元件 110px / 26px
       ========================================================== */
    .font-family-select {
      width: 110px;
      height: 26px; /* v0.8.166：28→26，與其他列控制項同步等高 */
      padding: 0 8px;
      border: 1px solid var(--jr-neutral-300);
      border-radius: var(--jr-radius-sm);
      background: var(--jr-surface);
      color: var(--jr-neutral-900);
      font-family: var(--jr-font-ui);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23888888' d='M0 0l5 6 5-6z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
      padding-right: 24px;
    }
    .font-family-select:hover { border-color: var(--jr-neutral-500); }
    .font-family-select:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--jr-primary-50); }

    /* ==========================================================
       Popup checkbox（v0.7.155 「此網域自動啟動」用）—— 與 options 同視覺
       語言，獨立 class 避免污染既有 popup button/select。
       ========================================================== */
    .popup-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin: 0;
      padding: 0;
      border: 1px solid var(--jr-neutral-300);
      border-radius: var(--jr-radius-sm);
      background: var(--jr-surface);
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
      position: relative;
    }
    .popup-checkbox:hover { border-color: var(--jr-neutral-500); }
    .popup-checkbox:checked {
      background: var(--jr-primary-600);
      border-color: var(--jr-primary-600);
    }
    .popup-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1px;
      width: 5px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .popup-checkbox:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--jr-primary-50);
    }
    /* 帶 hostname pill 的 label 改為左右 baseline；hostname 用 mono 字型 +
       次要色，與 settings label 區隔出「主名詞 + 機器辨識字串」階層。 */
    .auto-domain-label {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      max-width: 220px;
    }
    .auto-domain-label .host {
      font-family: var(--jr-font-mono);
      font-size: 11px;
      color: var(--jr-neutral-500);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    /* ==========================================================
       Auto toggle — off = ghost, on = filled blue
       ========================================================== */
    .font-controls { display: inline-flex; align-items: center; gap: 6px; }
    .auto-btn {
      height: 26px; /* v0.8.166：28→26，與其他列控制項同步等高 */
      padding: 0 10px;
      border-radius: var(--jr-radius-sm);
      border: 1px solid var(--jr-neutral-300);
      background: var(--jr-neutral-50);
      color: var(--jr-neutral-700);
      font-family: var(--jr-font-ui);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s ease, color 0.1s ease, border-color 0.1s ease;
      line-height: 1;
    }
    .auto-btn:hover { background: var(--jr-neutral-100); color: var(--jr-neutral-900); }
    .auto-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--jr-primary-50); }
    .auto-btn.active {
      background: var(--jr-primary-600);
      border-color: var(--jr-primary-600);
      color: #fff;
    }
    .auto-btn.active:hover {
      background: var(--jr-primary-700);
      border-color: var(--jr-primary-700);
    }

    /* ==========================================================
       Footer: shortcut hint + options link（同一 row 左右分配）
       ========================================================== */
    .footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--jr-space-2);
      /* v0.7.248：margin-top 16→12（popup 高度收斂）。v0.8.166：12→8（同上收斂） */
      margin-top: var(--jr-space-2);
      padding-top: var(--jr-space-2);
      border-top: 1px solid var(--jr-neutral-100);
    }
    .hint {
      font-family: var(--jr-font-ui);
      font-size: 12px;
      font-weight: 400;
      color: var(--jr-neutral-500);
      line-height: 1.5;
    }
    .hint code {
      display: inline-block;
      font-family: var(--jr-font-mono);
      font-size: 10px;
      padding: 2px 5px;
      border: 1px solid var(--jr-neutral-300);
      border-bottom-width: 2px;
      border-radius: var(--jr-radius-sm);
      background: var(--jr-neutral-50);
      color: var(--jr-neutral-900);
      line-height: 1;
      letter-spacing: 0.02em;
      margin: 0 1px;
    }

    .options-link {
      font-family: var(--jr-font-ui);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--jr-primary-600);
      text-decoration: none;
      border-radius: var(--jr-radius-sm);
      transition: color 0.1s ease;
      white-space: nowrap;
    }
    .options-link:hover { color: var(--jr-primary-700); text-decoration: underline; text-underline-offset: 3px; }
    .options-link:focus-visible { outline: none; color: var(--jr-primary-700); box-shadow: 0 0 0 3px var(--jr-primary-50); }
  </style>
</head>
<body>
  <div class="brand">
    <div class="logo" aria-hidden="true">J</div>
    <h1>JRead</h1>
    <div class="version">v<span id="version"></span></div>
  </div>

  <div id="status" hidden></div>
  <!-- v0.8.104：初始文字用「啟動閱讀模式」（最常見的 off 開啟態），popup.js
       refreshPopupForActiveTab 依 GET_READER_STATE 即時改成「退出閱讀模式」
       （已在閱讀模式時）/ 影院模式文字。 -->
  <button id="toggle-btn">啟動閱讀模式</button>
  <!-- v1.0.22：進入 Reader——開新分頁列 Readwise 收件匣最新文章，用 JRead 版型閱讀。
       與當前分頁的閱讀狀態無關（全域入口），僅在已設 readwiseToken 時顯示。 -->
  <button id="reader-btn" hidden title="開啟 Readwise Reader 收件匣最新文章，用 JRead 版型閱讀">進入 Reader</button>
  <button id="borderless-btn" hidden title="影片填滿視窗 + 自動 resize 視窗高度匹配影片比例（YouTube watch 頁專用）">啟動無邊模式</button>
  <button id="readwise-btn" hidden title="把當前 reader card 內容送到 Readwise Reader">送到 Readwise Reader</button>
  <button id="edit-btn" hidden title="進入編輯模式，點擊頁面上的雜訊段落即可移除（重新整理頁面後復原）">編輯模式：移除雜訊</button>
  <div id="readwise-status" hidden></div>

  <section class="settings">
    <div class="setting-row">
      <label>主題</label>
      <div class="theme-group" role="group" aria-label="主題">
        <button class="theme-btn" data-theme="light" title="亮色">亮</button>
        <button class="theme-btn" data-theme="dark"  title="暗色">暗</button>
        <button class="theme-btn" data-theme="sepia" title="米色">米</button>
        <button class="theme-btn" data-theme="gray"  title="灰色">灰</button>
      </div>
    </div>

    <div class="setting-row">
      <label>字級</label>
      <div class="font-controls">
        <button class="auto-btn" id="font-auto-btn"
          title="保留各站點原本的字級（不覆寫）">自動</button>
        <div class="stepper">
          <button data-action="font-dec" aria-label="字級減小">−</button>
          <span class="val" id="font-size-val">18</span>
          <button data-action="font-inc" aria-label="字級放大">+</button>
        </div>
      </div>
    </div>

    <div class="setting-row">
      <label>標題字級</label>
      <div class="font-controls">
        <button class="auto-btn" id="title-font-auto-btn"
          title="保留各站點原本的標題大小（不覆寫）">自動</button>
        <div class="stepper">
          <button data-action="title-font-dec" aria-label="標題字級減小">−</button>
          <span class="val" id="title-font-size-val">Auto</span>
          <button data-action="title-font-inc" aria-label="標題字級放大">+</button>
        </div>
      </div>
    </div>

    <div class="setting-row">
      <label>行距</label>
      <div class="font-controls">
        <button class="auto-btn" id="line-height-auto-btn"
          title="保留各站點原本的行距（不覆寫）">自動</button>
        <div class="stepper">
          <button data-action="line-height-dec" aria-label="行距減小">−</button>
          <span class="val" id="line-height-val">1.7</span>
          <button data-action="line-height-inc" aria-label="行距放大">+</button>
        </div>
      </div>
    </div>

    <div class="setting-row">
      <label>段落間距</label>
      <div class="font-controls">
        <button class="auto-btn" id="paragraph-spacing-auto-btn"
          title="保留各站點原本的段落間距（不覆寫）">自動</button>
        <div class="stepper">
          <button data-action="paragraph-spacing-dec" aria-label="段落間距縮小">−</button>
          <span class="val" id="paragraph-spacing-val">1</span>
          <button data-action="paragraph-spacing-inc" aria-label="段落間距放大">+</button>
        </div>
      </div>
    </div>

    <div class="setting-row">
      <label>版心寬度</label>
      <div class="stepper">
        <button data-action="width-dec" aria-label="版心變窄">−</button>
        <span class="val" id="content-width-val">720</span>
        <button data-action="width-inc" aria-label="版心變寬">+</button>
      </div>
    </div>

    <div class="setting-row">
      <label>字重</label>
      <div class="theme-group" role="group" aria-label="字重">
        <button class="theme-btn" data-weight="300" title="細（font-weight 300）">細</button>
        <button class="theme-btn" data-weight="400" title="中（font-weight 400，預設）">中</button>
        <button class="theme-btn" data-weight="600" title="粗（font-weight 600 Semibold）">粗</button>
      </div>
    </div>

    <div class="setting-row">
      <label for="font-family-select">中文字型</label>
      <select id="font-family-select" class="font-family-select" aria-label="中文字型">
        <option value="system-ui">系統預設</option>
        <option value="Georgia, &quot;Times New Roman&quot;, &quot;Noto Serif TC&quot;, &quot;Songti TC&quot;, &quot;Songti SC&quot;, &quot;Hiragino Mincho ProN&quot;, serif">襯線</option>
        <option value="-apple-system, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, &quot;Noto Sans TC&quot;, &quot;Helvetica Neue&quot;, sans-serif">無襯線</option>
        <option value="ui-monospace, Menlo, Consolas, monospace">等寬</option>
      </select>
    </div>

    <!-- v0.8.144：英文（拉丁）fallback 字型。只在「字型」選襯線 / 無襯線時顯示
         （render() 控制 hidden），各自記住選擇（latinSerif / latinSans）。
         「自動」= 沿用該選項內建西文字型（襯線 Georgia、無襯線 -apple-system）。 -->
    <div class="setting-row" id="latin-font-row" hidden>
      <label for="latin-font-select">英文字型</label>
      <select id="latin-font-select" class="font-family-select" aria-label="英文字型">
        <!-- v0.8.147：中文字型 = 系統預設 / 等寬 時英文無 base stack 可前接、不可
             自訂，此 sentinel（hidden、render 設 disabled + 動態文字）顯示「跟隨
             中文字型」狀態，讓 row 永遠在、不跳版。value 非 LATIN_FONTS key。 -->
        <option value="__follow" hidden>系統預設</option>
        <option value="auto">自動</option>
        <optgroup label="襯線">
          <option value="georgia">Georgia</option>
          <option value="palatino">Palatino</option>
          <option value="sourceserif">Source Serif</option>
          <option value="piazzolla">Piazzolla</option>
        </optgroup>
        <optgroup label="無襯線">
          <option value="helvetica">Helvetica Neue</option>
          <option value="arial">Arial</option>
          <option value="verdana">Verdana</option>
          <option value="publicsans">Public Sans</option>
          <option value="sourcesans">Source Sans</option>
        </optgroup>
        <optgroup label="等寬">
          <option value="sfmono">SF Mono</option>
          <option value="consolas">Consolas</option>
        </optgroup>
      </select>
    </div>

    <!-- v0.7.227：翻頁模式——電子書式水平翻頁（左右滑動 / ←→ 鍵 / 滾輪），
         圖片自動縮放至單頁內。 -->
    <div class="setting-row">
      <label for="paged-mode-cb" title="像電子書一樣左右翻頁：左右滑動、← → 鍵或滾輪翻頁，圖片自動縮放至單頁內">翻頁模式</label>
      <input type="checkbox" id="paged-mode-cb" class="popup-checkbox">
    </div>

    <!-- v0.7.155：此網域自動啟動。chrome:// / file:// 等無有效 hostname 的頁面
         此 row 整個 hidden（popup.js 開啟時動態判定）。-->
    <div class="setting-row" id="auto-domain-row" hidden>
      <label class="auto-domain-label" for="auto-domain-cb" title="頁面載入時自動進入閱讀模式；關閉會移除清單中所有符合此網域的條目">
        <span>此網域自動啟動</span>
        <span class="host" id="auto-domain-host"></span>
      </label>
      <input type="checkbox" id="auto-domain-cb" class="popup-checkbox">
    </div>
  </section>

  <!-- v0.7.255：快速鍵提示與「進階設定」位置對調（設定移左、提示移右） -->
  <div class="footer">
    <a href="#" class="options-link" id="open-options">← 進階設定</a>
    <div class="hint" id="shortcut-hint">
      <code>⌥</code><code>R</code> 切換純閱讀
    </div>
  </div>

  <script src="../content/settings-defaults.js"></script>
  <script src="../content/domain-match.js"></script>
  <script src="../content/shortcut-utils.js"></script>
  <script src="popup-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
