<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader — JRead</title>
<style>
  /* 主題色對齊 jread/content/styler.js 的 THEMES（light / dark / sepia / gray / night）：
     --bg ＝ pageBg、--link ＝ link、--card ＝ articleBg、--text ＝ text。
     刻意不同的兩處（2026-11-15 review D-05，Jimmy 看過對照圖裁定維持）：
     - dark 的 --card 是 #1f1f22，styler 閱讀卡是 #4a494d——清單卡片不是閱讀卡，
       一整列卡片用閱讀卡的中灰會太亮；「目前分頁」底色跟著 --card，同樣不動
     - light / sepia / gray 的 --text 是 #1a1a1a，閱讀卡內文是純黑 #000000——這裡是
       介面文字（標題列、清單、狀態），不是內文
     forcing：test/regression/review-1115-b5-reader.spec.js 逐主題比對 --bg / --link，
     上面兩處寫在例外表；改任何一邊的色值 spec 會提醒重新確認 */
  :root { --bg:#ececec; --card:#ffffff; --text:#1a1a1a; --muted:#6b6b6b; --link:#1a73e8; --line:rgba(0,0,0,0.08); }
  /* 底部安全距離（v3.1.1）：iOS App 內 JReader 的頁面沒有 viewport-fit=cover，var(--jr-safe-bottom) 恆為 0，
     但 WebView 畫到 Home 指示條底下——底部值由 App 經 --__jread-app-safe-bottom 帶進來（shim-src/app-backend.js）。
     兩者取大者；與 content/styler.js 的 SAFE_BOTTOM 同一個式子（styler 是注入的 CSS 字串，兩處要一起改）。
     3.1.0 的底部工具列只用 env()，在 App 裡貼到螢幕最底、被 Home 指示條壓住 */
  :root { --jr-safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--__jread-app-safe-bottom, 0px)); }
  /* JS 讀完 storage 才設 data-theme；在那之前依系統深色偏好先給深色變數，
     深色使用者不再每次先閃一下淺灰（2026-10-07 review F-10） */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) { --bg:#0b0b0b; --card:#1f1f22; --text:#ecebf1; --muted:#9a99a2; --link:#7fb5e6; --line:rgba(255,255,255,0.1); }
  }
  :root[data-theme="dark"]  { --bg:#0b0b0b; --card:#1f1f22; --text:#ecebf1; --muted:#9a99a2; --link:#7fb5e6; --line:rgba(255,255,255,0.1); }
  :root[data-theme="sepia"] { --bg:#cdb891; --card:#eee2cb; --text:#1a1a1a; --muted:#6f6149; --link:#2c5282; --line:rgba(60,50,38,0.14); }
  :root[data-theme="gray"]  { --bg:#d8d8d8; --card:#ededed; --text:#1a1a1a; --muted:#6b6b6b; --link:#2c5282; --line:rgba(0,0,0,0.1); }
  :root[data-theme="night"] { --bg:#070b10; --card:#0f1821; --text:#cdd5df; --muted:#7d8896; --link:#6ea8e6; --line:rgba(205,213,223,0.1); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* 關掉 iOS WebKit 文字自動放大：轉橫向時 WebKit 會把部分文字放大，轉回直向也不縮回，
     字級前後不一、翻頁頁數與頁界跟著錯位（Jimmy 2026-10-29 回報 App 旋轉後排版壞） */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .jr-wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px 80px; }
  .jr-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 20px; }
  .jr-head h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .jr-head .jr-sub { font-size: 13px; color: var(--muted); }
  .jr-list { display: flex; flex-direction: column; gap: 12px; }

  .jr-card {
    position: relative; display: flex; align-items: stretch;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden;
    /* v2.4.0：垂直捲動交給瀏覽器，水平位移由 reader-feed.js 接成左右滑動 */
    touch-action: pan-y;
  }
  .jr-card.is-busy { opacity: 0.6; }
  .jr-card.is-menu { box-shadow: 0 0 0 2px var(--link); }
  /* v3.1.0 多選：勾選的卡片（外框＋左上角勾，不只靠顏色）、底部動作列；多選中藏工具列圓鈕 */
  .jr-card.is-picked { box-shadow: 0 0 0 2px var(--link); background: color-mix(in srgb, var(--link) 8%, var(--card)); }
  .jr-card.is-picked::before {
    content: '✓'; position: absolute; top: 8px; right: 8px; z-index: 2; width: 20px; height: 20px; border-radius: 10px;
    background: var(--link); color: #fff; font-size: 13px; font-weight: 700; line-height: 20px; text-align: center;
  }
  .jr-selecting .jr-fab, .jr-selecting .jr-tools-wrap { display: none; }
  /* 動作列蓋住清單最後幾張：多選中清單底部留空 */
  .jr-select-bar {
    position: fixed; left: 50%; bottom: calc(16px + var(--jr-safe-bottom)); transform: translateX(-50%); z-index: 50;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px;
    width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 8px 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.18);
  }
  .jr-select-count { padding: 0 6px; font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .jr-select-btn {
    height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: transparent;
    color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .jr-select-btn:disabled { opacity: .45; cursor: default; }
  .jr-select-btn.is-danger { color: #c62828; }
  .jr-select-close { width: 32px; padding: 0; }
  .jr-select-tagrow { display: flex; gap: 6px; flex: 1 0 100%; justify-content: center; }
  .jr-select-tag { width: 180px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg, var(--card)); color: var(--text); font: inherit; font-size: 13px; }
  /* 鍵盤 J / K 選到的卡片 */
  .jr-card.is-kb { box-shadow: 0 0 0 2px var(--link); }
  .jr-card-link {
    position: relative; z-index: 1;
    display: flex; gap: 14px; align-items: center; flex: 1 1 auto; min-width: 0;
    padding: 14px 16px; text-decoration: none; color: inherit;
    background: var(--card);
    -webkit-touch-callout: default; -webkit-user-drag: none;
  }
  .jr-card.is-swiping .jr-card-link { -webkit-user-select: none; user-select: none; }
  /* v3.2.7：觸控長按改開卡片選單（reader-feed attachContextMenu）——有選單的卡片關掉
     文字選取與系統長按選單，否則 iOS 長按先進文字選取。沒有選單的分頁照舊保留系統選單。
     v3.2.8：一併關掉點擊高亮——WebKit 把長按後的放手也當點擊，整張卡片閃灰一格
     （Jimmy 2026-11-25 回報，模擬器錄影逐格確認） */
  @media (pointer: coarse) {
    .jr-card.has-menu, .jr-card.has-menu .jr-card-link { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  }
  /* v3.1.0：卡片加了日期與兩行摘要後變高，縮圖從 64px 放大到 88px（≈ 標題＋副標＋兩行摘要的
     高度），全部卡片同尺寸；窄螢幕 72px，不擠壓文字欄（Jimmy 2026-11-24「卡片變大但圖看起來小了」） */
  .jr-thumb {
    flex: 0 0 auto; width: 88px; height: 88px; border-radius: 10px;
    object-fit: cover; background: var(--line);
  }
  @media (max-width: 480px) {
    .jr-thumb { width: 72px; height: 72px; border-radius: 8px; }
  }
  .jr-card-body { min-width: 0; }
  .jr-card-title {
    font-size: 16px; font-weight: 600; line-height: 1.35; margin: 0 0 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .jr-card-meta {
    font-size: 12.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* v2.4.0：滑動底層。右滑露出左側「Later / 加星」、左滑露出右側「封存」；
     過門檻（.is-armed）才上實色，放手會執行——顏色＋字重雙通道提示 */
  .jr-swipe-bg {
    position: absolute; inset: 0; z-index: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; background: var(--line);
    font-size: 14px; font-weight: 600; color: var(--muted);
    visibility: hidden;
  }
  .jr-card[data-swipe="later"] .jr-swipe-bg,
  .jr-card[data-swipe="archive"] .jr-swipe-bg { visibility: visible; }
  .jr-card[data-swipe="later"] .jr-swipe-archive,
  .jr-card[data-swipe="archive"] .jr-swipe-later { visibility: hidden; }
  .jr-card.is-armed[data-swipe="later"] .jr-swipe-bg { background: #c98a1b; color: #fff; font-weight: 700; }
  .jr-card.is-armed[data-swipe="archive"] .jr-swipe-bg { background: #2f8f5b; color: #fff; font-weight: 700; }

  /* v2.4.0：右鍵選單（桌面滑鼠） */
  .jr-menu {
    position: fixed; z-index: 2147483000; min-width: 132px; padding: 4px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .jr-menu-item {
    display: block; width: 100%; text-align: left;
    padding: 8px 12px; border: 0; border-radius: 6px; background: transparent;
    color: inherit; font: inherit; font-size: 14px; cursor: pointer;
  }
  .jr-menu-item:hover, .jr-menu-item:focus-visible { background: var(--line); outline: none; }

  .jr-msg { color: var(--muted); font-size: 15px; line-height: 1.7; padding: 40px 4px; text-align: center; }
  .jr-msg a { color: var(--link); }
  .jr-msg.jr-error { color: var(--text); }

  /* v1.0.25：來源分頁 Inbox / Later / JRead（segmented control，主題色） */
  .jr-tabs {
    display: flex; gap: 4px; margin: 0 0 18px;
    background: var(--line); border-radius: 11px; padding: 4px;
  }
  .jr-tab {
    flex: 1; padding: 8px 0; border: 0; background: transparent;
    color: var(--muted); font-family: inherit; font-size: 14px; font-weight: 600;
    border-radius: 8px; cursor: pointer; transition: background .15s, color .15s;
  }
  .jr-tab.is-active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  /* v3.1.0：JReader 書庫工具列（reader-library.js；只在儲存服務是 JReader 時出現）。
     搜尋框與按鈕同高（= 分頁列外框高 40px），底色 / 邊框 / 圓角沿用分頁列的變數 */
  /* 固定在畫面底部（Jimmy 2026-11-24）：外層滿版、帶頁面底色與上緣分隔線，讓清單捲到它
     底下時不透出來；內層與清單同寬置中。iPhone 底部手勢區用 safe-area 墊高 */
  .jr-tools-wrap {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2147482000;
    background: var(--bg); border-top: 1px solid var(--line);
    padding: 10px 20px calc(10px + var(--jr-safe-bottom));
  }
  /* iOS 螢幕鍵盤開著：reader-library 把鍵盤高度寫進 --jr-kb，工具列墊到鍵盤正上方；
     底部手勢區被鍵盤蓋住，safe-area 墊高拿掉（Jimmy 2026-11-25「搜尋列被推到鍵盤後面」） */
  body.jr-kb-open .jr-tools-wrap { bottom: var(--jr-kb, 0px); padding-bottom: 10px; }
  .jr-tools-inner { max-width: 640px; margin: 0 auto; }
  .jr-tools-wrap[hidden] { display: none; }
  /* 清單底部留空：收起時讓出圓鈕、展開時讓出工具列（＋貼網址列 / 標籤 chip），最後一張卡片不被蓋住 */
  body.jr-has-tools .jr-wrap { padding-bottom: calc(76px + var(--jr-safe-bottom)); }
  body.jr-tools-open .jr-wrap { padding-bottom: calc(150px + var(--jr-safe-bottom)); }
  body.jr-tools-open.jr-kb-open:not(.jr-selecting) .jr-wrap { padding-bottom: calc(150px + var(--jr-kb, 0px)); }
  /* 多選中讓出底部動作列（reader-select 把動作列實際高度寫進 --jr-select-bar-h：按鈕折行、
     標籤輸入列都會變高；量不到時 140px）。必須排在上面兩條之後、權重相同（0,2,1）才蓋得過——
     原本寫成 .jr-selecting .jr-wrap（0,2,0）永遠輸給 jr-has-tools（2026-11-24 審核 A-2） */
  body.jr-selecting .jr-wrap { padding-bottom: calc(var(--jr-select-bar-h, 140px) + 24px + var(--jr-safe-bottom)); }
  /* toast（content/toast.js，掛 <html> 直下、預設離底 20px、讀 --__jread-toast-bottom）讓出底部固定元素：
     收起時的圓鈕（20 + 36）、展開的工具列（reader-library 量的 --jr-tools-h）、多選動作列（16 + --jr-select-bar-h）。
     原本疊在它們上面（2026-11-24 審核 A-8）。三條權重相同、後面的優先：多選＞展開＞收起 */
  html:has(> body.jr-has-tools) { --__jread-toast-bottom: calc(68px + var(--jr-safe-bottom)); }
  html:has(> body.jr-tools-open) { --__jread-toast-bottom: calc(var(--jr-tools-h, 116px) + var(--jr-kb, 0px) + 12px); }
  html:has(> body.jr-selecting) { --__jread-toast-bottom: calc(var(--jr-select-bar-h, 140px) + 28px + var(--jr-safe-bottom)); }
  /* 右下角搜尋圓鈕（Jimmy 2026-11-24 選「平常只有一顆按鈕」，再選「縮小淡化＋捲動時隱藏」）。
     寬螢幕對齊卡片欄右緣（欄寬 640 置中 → 右緣距視窗 50% − 320px；fixed 的 % 以不含捲軸的視窗寬為準，
     50vw 含捲軸寬、傳統捲軸下偏約 7px——2026-11-24 審核 A-10），窄螢幕離右邊 20px。
     平常：36px、透明底、細框、淡灰圖示，退到背景；滑鼠移上 / 鍵盤聚焦才清楚。
     往下捲時（.is-scroll-hidden，reader-library.js 加）完全淡出且不能點；往上捲或停 0.4 秒回來 */
  .jr-fab {
    position: fixed; z-index: 2147482000; width: 36px; height: 36px; padding: 0;
    right: max(20px, calc(50% - 320px)); bottom: calc(20px + var(--jr-safe-bottom));
    display: flex; align-items: center; justify-content: center;
    background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 18px;
    opacity: .7; cursor: pointer; transition: opacity .15s ease, color .15s ease, background-color .15s ease;
  }
  .jr-fab[hidden] { display: none; }
  .jr-fab svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .jr-fab:hover, .jr-fab:focus-visible { opacity: 1; color: var(--text); background: var(--card); border-color: var(--muted); outline: none; }
  .jr-fab.is-scroll-hidden { opacity: 0; pointer-events: none; }
  /* 標籤篩選中：連結色框＋圖示同色（雙通道），不淡化、捲動也不藏——提醒目前在篩選 */
  .jr-fab.is-on, .jr-fab.is-on.is-scroll-hidden { opacity: 1; pointer-events: auto; color: var(--link); border: 2px solid var(--link); background: var(--card); }
  @media (prefers-reduced-motion: reduce) { .jr-fab { transition: none; } }
  .jr-tool-close { width: 40px; padding: 0; font-size: 20px; font-weight: 500; color: var(--muted); }
  .jr-tools, .jr-addrow { display: flex; gap: 8px; align-items: stretch; }
  .jr-addrow { margin-bottom: 8px; }
  .jr-addrow[hidden], .jr-filter[hidden], .jr-search-head[hidden], .jr-tabs[hidden] { display: none; }
  .jr-search, .jr-addrow-url {
    flex: 1 1 auto; min-width: 0; height: 40px; padding: 0 14px;
    background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 11px;
    font: inherit; font-size: 15px; outline: none; -webkit-appearance: none; appearance: none;
  }
  .jr-search::placeholder, .jr-addrow-url::placeholder { color: var(--muted); }
  .jr-search:focus, .jr-addrow-url:focus { border-color: var(--link); box-shadow: 0 0 0 1px var(--link); }
  .jr-tool-btn {
    flex: 0 0 auto; height: 40px; min-width: 40px; padding: 0 12px;
    background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 11px;
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .jr-tool-add { width: 40px; padding: 0; font-size: 20px; font-weight: 500; }
  .jr-tool-btn:hover { border-color: var(--muted); }
  /* 開著 / 篩選中：連結色字＋同色框線（雙通道，不只靠顏色） */
  .jr-tool-btn.is-on { color: var(--link); border-color: var(--link); }
  .jr-tool-btn:disabled { opacity: .5; cursor: default; }
  .jr-filter { margin-bottom: 8px; display: flex; }
  .jr-chip {
    display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px 0 12px;
    background: var(--card); border: 1px solid var(--link); border-radius: 14px;
    color: var(--link); font-size: 13px; font-weight: 600;
  }
  .jr-chip-x {
    width: 22px; height: 22px; border: 0; border-radius: 11px; background: transparent;
    color: inherit; font-size: 15px; line-height: 1; cursor: pointer;
  }
  .jr-chip-x:hover { background: var(--line); }
  /* 搜尋結果上方：「找到 N 篇」＋排序三段切換（樣式同分頁列，縮小一號） */
  /* 資料夾篩選（左）＋排序（右）同一列，窄畫面排序折到下一行；「找到 N 篇」獨立一行在下面 */
  .jr-search-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
    font-size: 13px; color: var(--muted); margin: 0 0 10px 2px; }
  .jr-search-meta { flex: 1 0 100%; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
  .jr-search-hint { margin-left: auto; font-size: 12px; opacity: .8; }
  .jr-sort { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--line); }
  .jr-sort-btn, .jr-folder-btn {
    height: 26px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent;
    color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .jr-sort-btn.is-active, .jr-folder-btn.is-active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .jr-pending-list:empty { display: none; }
  .jr-pending-list { margin: 0 0 12px; }
  .jr-pending .jr-card-meta a { color: var(--link); }
  .jr-pending-close {
    position: absolute; top: 6px; right: 6px; z-index: 2; width: 28px; height: 28px;
    border: 0; border-radius: 14px; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer;
  }
  .jr-pending-close:hover { background: var(--line); }
  .jr-card-snippet {
    margin-top: 6px; font-size: 13px; line-height: 1.55; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* 摘錄來自劃過的重點：前面一個小標，用重點的黃色系、加外框（不只靠顏色） */
  .jr-snippet-hl { display: inline-block; margin-right: 6px; padding: 0 5px; border: 1px solid rgba(214,160,0,.7);
    border-radius: 4px; background: rgba(255,214,0,.22); color: inherit; font-size: 11px; font-weight: 700; line-height: 16px; vertical-align: 1px; }
  .jr-card-snippet b { color: var(--text); font-weight: 700; }
  .jr-search-more { height: 1px; }

  /* v3.1.0：卡片副標＝作者 · 網站（太長時截這段）＋日期（不截）；摘要兩行 */
  .jr-card-meta { display: flex; align-items: baseline; min-width: 0; }
  .jr-card-src { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jr-card-date { flex: 0 0 auto; white-space: nowrap; }
  .jr-card-summary {
    margin-top: 6px; font-size: 13px; line-height: 1.55; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* 搜尋結果的資料夾標籤：小框＋字重（不只靠顏色區分），Inbox / Later / Archive 各一種框色 */
  .jr-loc-badge {
    flex: 0 0 auto; margin-right: 8px; padding: 0 6px; height: 18px; line-height: 16px;
    border: 1px solid var(--muted); border-radius: 5px;
    font-size: 11px; font-weight: 700; color: var(--text); letter-spacing: .02em;
  }
  .jr-loc-badge[data-loc="new"] { border-color: var(--link); color: var(--link); }
  .jr-loc-badge[data-loc="later"] { border-color: #c98a1b; color: #c98a1b; }
  /* 「載入更多」：與卡片同寬、同圓角的次要按鈕；搜尋中不顯示 */
  .jr-more {
    display: block; width: 100%; height: 44px; margin: 12px 0 0;
    background: transparent; color: var(--link); border: 1px dashed var(--line); border-radius: 12px;
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .jr-more:hover { border-color: var(--link); }
  .jr-more:disabled { color: var(--muted); cursor: default; }
  .jr-more[hidden], .jr-searching .jr-more { display: none; }

  /* v3.1.0：垃圾桶。入口是清單最底部的淡色文字（很少用，不佔分頁列）；進去後上方一列「← 返回　垃圾桶　清空垃圾桶」 */
  .jr-trash-link {
    display: block; margin: 28px auto 0; padding: 6px 12px; border: 0; background: transparent;
    color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  .jr-trash-link:hover { color: var(--text); }
  .jr-trash-link[hidden], .jr-searching .jr-trash-link, .jr-trash-head[hidden] { display: none; }
  .jr-trash-head { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  .jr-trash-title { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; align-items: baseline;
    font-size: 15px; font-weight: 700; white-space: nowrap; }
  .jr-head-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .jr-trash-note { margin: -4px 0 12px; text-align: center; font-size: 12px; color: var(--muted); }
  .jr-trash-note[hidden], .jr-searching .jr-trash-note { display: none; }
  .jr-head-count { flex: 0 0 auto; margin-left: 8px; font-weight: 500; color: var(--muted); }
  .jr-head-count:empty { display: none; }
  /* 同作者 / 同網域的子清單沒有「清空垃圾桶」：佔位但不顯示，標題維持置中 */
  .jr-trash-empty[hidden] { display: inline-block; visibility: hidden; }
  .jr-trash-back, .jr-trash-empty {
    flex: 0 0 auto; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .jr-trash-empty { color: #c62828; }
  .jr-menu-item.is-danger { color: #c62828; }
  .jr-tagmenu { width: 260px; display: flex; flex-direction: column; gap: 4px; }
  .jr-tagmenu-filter {
    height: 34px; padding: 0 10px; margin: 2px 2px 4px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--text); font: inherit; font-size: 14px; outline: none;
  }
  .jr-tagmenu-filter:focus { border-color: var(--link); }
  .jr-tagmenu-list { max-height: min(50vh, 360px); overflow-y: auto; }
  .jr-tagmenu-item { display: flex; align-items: baseline; gap: 8px; }
  .jr-tagmenu-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jr-tagmenu-count { flex: 0 0 auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .jr-tagmenu-item.is-on { color: var(--link); font-weight: 600; }
  .jr-tagmenu-item.is-active { background: var(--line); } /* v3.4.4：打字時預設選到的那個，Enter 選它 */
  .jr-tagmenu-empty { padding: 8px 12px; font-size: 13px; color: var(--muted); }
  /* iOS 聚焦字級小於 16px 的輸入框會自動放大整頁、收起鍵盤也不縮回（v3.1.1，3.1.0 搜尋框 15px、
     多選標籤框 13px 在 iPhone 上中招）。觸控裝置一律 16px，電腦上維持原本字級。
     新增輸入框要加進這裡（forcing：jreader-ios-touch.spec 掃 reader 模組建立的每個 input / textarea） */
  @media (pointer: coarse) {
    .jr-search, .jr-addrow-url, .jr-select-tag, .jr-tagmenu-filter { font-size: 16px; }
  }
</style>
</head>
<body>
  <main class="jr-wrap">
    <!-- v1.6.0：分頁由 reader-feed.js 依 FEED_TABS[service] 動態建立
         （readwise=Inbox/Later/JRead、instapaper=未讀/已加星/封存）。 -->
    <div class="jr-tabs" id="jr-tabs"></div>
    <div class="jr-list" id="jr-list"></div>
    <!-- 預設可見「載入中…」：即使 JS 因故沒跑（iOS 平台問題）頁面也不會全白，
         JS 接手後由 reader-feed.js 換成卡片或對應訊息。 -->
    <div class="jr-msg" id="jr-msg">載入中…</div>
  </main>

  <!-- 只載 feed 需要的最小集合：NS 命名空間、預設值、toast、Reader API、feed app。
       不載 styler / floating-icon / main 等 reader 閱讀模式模組（那些在 article.html）。 -->
  <script src="../content/namespace.js"></script>
  <script src="../content/settings-defaults.js"></script>
  <script src="../content/toast.js"></script>
  <!-- v1.6.0：Instapaper client + gitignored 金鑰（keys 缺檔時 __JReadInstapaper
       仍載入、getInstapaperConsumerKeys 回 null，Readwise 照常）。須在 popup-core 前。 -->
  <script src="../lib/instapaper-keys.js"></script>
  <script src="../lib/instapaper.js"></script>
  <script src="../popup/popup-core.js"></script>
  <script src="reader-cache.js"></script>
  <!-- v3.1.0：確認對話框（刪除 / 永久刪除 / 清空垃圾桶），讀 reader-cache 的主題色 -->
  <script src="reader-dialog.js"></script>
  <!-- v3.1.0：清單多選（JReader），reader-feed init 掛上 -->
  <script src="reader-select.js"></script>
  <!-- v3.1.0：JReader 書庫工具列（搜尋 / 貼網址 / 標籤），須在 reader-feed 前 -->
  <script src="reader-library.js"></script>
  <!-- v3.1.0：快速鍵說明（? 鍵） -->
  <script src="reader-shortcuts.js"></script>
  <script src="reader-feed.js"></script>
</body>
</html>
