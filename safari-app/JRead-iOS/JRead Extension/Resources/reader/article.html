<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JRead</title>
<style>
  /* 進入閱讀模式前的過場底色（對齊 styler THEMES，避免白閃）。reader 模式套用後
     由 styler 接管頁面樣式。 */
  /* token 對齊 reader.html（--text / --link 四主題，2026-10-07 review F-10） */
  :root { --bg:#ececec; --text:#1a1a1a; --muted:#6b6b6b; --link:#1a73e8; }
  /* JS 讀完 storage 才設 data-theme；在那之前依系統深色偏好先給深色變數，
     深色使用者不再每次先閃一下淺灰（F-10） */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) { --bg:#0b0b0b; --text:#ecebf1; --muted:#9a99a2; --link:#7fb5e6; }
  }
  :root[data-theme="dark"]  { --bg:#0b0b0b; --text:#ecebf1; --muted:#9a99a2; --link:#7fb5e6; }
  :root[data-theme="sepia"] { --bg:#cdb891; --text:#1a1a1a; --muted:#6f6149; --link:#2c5282; }
  :root[data-theme="gray"]  { --bg:#d8d8d8; --text:#1a1a1a; --muted:#6b6b6b; --link:#2c5282; }
  :root[data-theme="night"] { --bg:#070b10; --text:#cdd5df; --muted:#7d8896; --link:#6ea8e6; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  /* 關掉 iOS WebKit 文字自動放大：轉橫向時 WebKit 會把部分文字放大，轉回直向也不縮回，
     字級前後不一、翻頁頁數與頁界跟著錯位（Jimmy 2026-10-29 回報 App 旋轉後排版壞） */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  #jr-status {
    color: var(--muted); font: 15px/1.7 system-ui, -apple-system, "PingFang TC", sans-serif;
    text-align: center; padding: 80px 20px;
  }
  #jr-status a { color: var(--link); text-decoration: underline; }
</style>
</head>
<body>
  <div id="jr-status">載入中…</div>

  <!-- 載入 reader 閱讀模式模組堆疊（重用真 styler / positionMemory）。這份清單是
       manifest content_scripts 的子集，順序照 manifest；forcing spec
       review-1115-b5-reader.spec.js 驗「本頁載入的模組 ＝ manifest 清單 − 下列刻意不載」，
       manifest 新增模組時必須二選一：補進這裡，或列進下表（spec 內的排除表同步）。
       刻意不載（2026-11-15 review D-07，Jimmy 裁定）：
       - detector：繞過，container 由本頁的 reader-article 模組自建
       - cleaner / edit-mode / site-overrides：內容已是儲存服務的乾淨主文，沒有雜訊可清、
         可編輯；site-overrides 是 cleaner 的站點規則表
       - custom-shortcuts（＋它專用的 shortcut-utils）、touch-gestures：自訂快速鍵與三指輕點
         的動作是「切換閱讀模式」，Article View 的退出＝回 feed，語意不同，另議
       - cinema-mode / youtube-borderless / x-thread / fb-post：站點專用的進場路徑
       - home-launcher / orion-detect / keepalive / domain-match / link-follow：一般網頁
         的常駐機制（主畫面跳板、Orion 偵測、SW 保活、自動進場網域、連結跟隨）
       popup-core 在下方與 Instapaper client 一起載（順序需求不同）。 -->
  <!-- v2.5.1（D-07）：除錯記錄，必須第一個載入（同 manifest）。context 名稱由
       reader-article 模組設成 article（main.js 會先設成 content） -->
  <script src="../lib/logger.js"></script>
  <script src="../content/namespace.js"></script>
  <script src="../content/settings-defaults.js"></script>
  <script src="../content/toast.js"></script>
  <script src="../content/floating-icon.js"></script>
  <script src="../content/styler.js"></script>
  <script src="../content/space-scroll.js"></script>
  <!-- v2.5.1（D-07）：閒置隱藏游標（設定 idleCursorHide，預設開）。觸控裝置沒有
       精確指標，模組自己不掛 listener -->
  <script src="../content/idle-cursor.js"></script>
  <script src="../content/paged-mode.js"></script>
  <script src="../content/position-memory.js"></script>
  <script src="../content/main.js"></script>
  <!-- v1.6.0：Instapaper client + gitignored 金鑰（須在 popup-core 前）。 -->
  <script src="../lib/instapaper-keys.js"></script>
  <script src="../lib/instapaper.js"></script>
  <script src="../popup/popup-core.js"></script>
  <!-- v1.10.0：JReader 畫重點（須在 reader-article 前） -->
  <script src="reader-highlights.js"></script>
  <script src="reader-cache.js"></script>
  <script src="reader-article.js"></script>
</body>
</html>
