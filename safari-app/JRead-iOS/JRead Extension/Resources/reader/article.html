<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JRead</title>
<style>
  /* 進入閱讀模式前的過場底色（對齊 styler THEMES，避免白閃）。reader 模式套用後
     由 styler 接管頁面樣式。 */
  /* token 對齊 reader.html（--text / --link 四主題，2026-10-07 review F-10） */
  :root { --bg:#ececec; --text:#1a1a1a; --muted:#6b6b6b; --link:#1a73e8; }
  /* JS 讀完 storage 才設 data-theme；在那之前依系統深色偏好先給深色變數，
     深色使用者不再每次先閃一下淺灰（F-10） */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) { --bg:#0b0b0b; --text:#ecebf1; --muted:#9a99a2; --link:#7fb5e6; }
  }
  :root[data-theme="dark"]  { --bg:#0b0b0b; --text:#ecebf1; --muted:#9a99a2; --link:#7fb5e6; }
  :root[data-theme="sepia"] { --bg:#cdb891; --text:#1a1a1a; --muted:#6f6149; --link:#2c5282; }
  :root[data-theme="gray"]  { --bg:#d8d8d8; --text:#1a1a1a; --muted:#6b6b6b; --link:#2c5282; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  #jr-status {
    color: var(--muted); font: 15px/1.7 system-ui, -apple-system, "PingFang TC", sans-serif;
    text-align: center; padding: 80px 20px;
  }
  #jr-status a { color: var(--link); text-decoration: underline; }
</style>
</head>
<body>
  <div id="jr-status">載入中…</div>

  <!-- 載入完整 reader 閱讀模式模組堆疊（重用真 styler / positionMemory）。
       不載 detector（繞過自建 container）/ cleaner（內容已是 Readwise 乾淨主文）。 -->
  <script src="../content/namespace.js"></script>
  <script src="../content/settings-defaults.js"></script>
  <script src="../content/toast.js"></script>
  <script src="../content/floating-icon.js"></script>
  <script src="../content/styler.js"></script>
  <script src="../content/space-scroll.js"></script>
  <script src="../content/paged-mode.js"></script>
  <script src="../content/position-memory.js"></script>
  <script src="../content/main.js"></script>
  <!-- v1.6.0：Instapaper client + gitignored 金鑰（須在 popup-core 前）。 -->
  <script src="../lib/instapaper-keys.js"></script>
  <script src="../lib/instapaper.js"></script>
  <script src="../popup/popup-core.js"></script>
  <script src="reader-article.js"></script>
</body>
</html>
