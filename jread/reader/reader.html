<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader — JRead</title>
<style>
  /* 主題色對齊 jread/content/styler.js 的 THEMES（light / dark / sepia / gray / night） */
  :root { --bg:#ececec; --card:#ffffff; --text:#1a1a1a; --muted:#6b6b6b; --link:#1a73e8; --line:rgba(0,0,0,0.08); }
  /* JS 讀完 storage 才設 data-theme；在那之前依系統深色偏好先給深色變數，
     深色使用者不再每次先閃一下淺灰（2026-10-07 review F-10） */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) { --bg:#0b0b0b; --card:#1f1f22; --text:#ecebf1; --muted:#9a99a2; --link:#7fb5e6; --line:rgba(255,255,255,0.1); }
  }
  :root[data-theme="dark"]  { --bg:#0b0b0b; --card:#1f1f22; --text:#ecebf1; --muted:#9a99a2; --link:#7fb5e6; --line:rgba(255,255,255,0.1); }
  :root[data-theme="sepia"] { --bg:#cdb891; --card:#eee2cb; --text:#1a1a1a; --muted:#6f6149; --link:#2c5282; --line:rgba(60,50,38,0.14); }
  :root[data-theme="gray"]  { --bg:#d8d8d8; --card:#ededed; --text:#1a1a1a; --muted:#6b6b6b; --link:#2c5282; --line:rgba(0,0,0,0.1); }
  :root[data-theme="night"] { --bg:#070b10; --card:#0f1821; --text:#cdd5df; --muted:#7d8896; --link:#6ea8e6; --line:rgba(205,213,223,0.1); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* 關掉 iOS WebKit 文字自動放大：轉橫向時 WebKit 會把部分文字放大，轉回直向也不縮回，
     字級前後不一、翻頁頁數與頁界跟著錯位（Jimmy 2026-10-29 回報 App 旋轉後排版壞） */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .jr-wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px 80px; }
  .jr-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 20px; }
  .jr-head h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .jr-head .jr-sub { font-size: 13px; color: var(--muted); }
  .jr-list { display: flex; flex-direction: column; gap: 12px; }

  .jr-card {
    position: relative; display: flex; align-items: stretch;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden;
    /* v2.4.0：垂直捲動交給瀏覽器，水平位移由 reader-feed.js 接成左右滑動 */
    touch-action: pan-y;
  }
  .jr-card.is-busy { opacity: 0.6; }
  .jr-card.is-menu { box-shadow: 0 0 0 2px var(--link); }
  .jr-card-link {
    position: relative; z-index: 1;
    display: flex; gap: 14px; align-items: center; flex: 1 1 auto; min-width: 0;
    padding: 14px 16px; text-decoration: none; color: inherit;
    background: var(--card);
    -webkit-touch-callout: default; -webkit-user-drag: none;
  }
  .jr-card.is-swiping .jr-card-link { -webkit-user-select: none; user-select: none; }
  .jr-thumb {
    flex: 0 0 auto; width: 64px; height: 64px; border-radius: 8px;
    object-fit: cover; background: var(--line);
  }
  .jr-card-body { min-width: 0; }
  .jr-card-title {
    font-size: 16px; font-weight: 600; line-height: 1.35; margin: 0 0 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .jr-card-meta {
    font-size: 12.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* v2.4.0：滑動底層。右滑露出左側「Later / 加星」、左滑露出右側「封存」；
     過門檻（.is-armed）才上實色，放手會執行——顏色＋字重雙通道提示 */
  .jr-swipe-bg {
    position: absolute; inset: 0; z-index: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; background: var(--line);
    font-size: 14px; font-weight: 600; color: var(--muted);
    visibility: hidden;
  }
  .jr-card[data-swipe="later"] .jr-swipe-bg,
  .jr-card[data-swipe="archive"] .jr-swipe-bg { visibility: visible; }
  .jr-card[data-swipe="later"] .jr-swipe-archive,
  .jr-card[data-swipe="archive"] .jr-swipe-later { visibility: hidden; }
  .jr-card.is-armed[data-swipe="later"] .jr-swipe-bg { background: #c98a1b; color: #fff; font-weight: 700; }
  .jr-card.is-armed[data-swipe="archive"] .jr-swipe-bg { background: #2f8f5b; color: #fff; font-weight: 700; }

  /* v2.4.0：右鍵選單（桌面滑鼠） */
  .jr-menu {
    position: fixed; z-index: 2147483000; min-width: 132px; padding: 4px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .jr-menu-item {
    display: block; width: 100%; text-align: left;
    padding: 8px 12px; border: 0; border-radius: 6px; background: transparent;
    color: inherit; font: inherit; font-size: 14px; cursor: pointer;
  }
  .jr-menu-item:hover, .jr-menu-item:focus-visible { background: var(--line); outline: none; }

  .jr-msg { color: var(--muted); font-size: 15px; line-height: 1.7; padding: 40px 4px; text-align: center; }
  .jr-msg a { color: var(--link); }
  .jr-msg.jr-error { color: var(--text); }

  /* v1.0.25：來源分頁 Inbox / Later / JRead（segmented control，主題色） */
  .jr-tabs {
    display: flex; gap: 4px; margin: 0 0 18px;
    background: var(--line); border-radius: 11px; padding: 4px;
  }
  .jr-tab {
    flex: 1; padding: 8px 0; border: 0; background: transparent;
    color: var(--muted); font-family: inherit; font-size: 14px; font-weight: 600;
    border-radius: 8px; cursor: pointer; transition: background .15s, color .15s;
  }
  .jr-tab.is-active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
</style>
</head>
<body>
  <main class="jr-wrap">
    <!-- v1.6.0：分頁由 reader-feed.js 依 FEED_TABS[service] 動態建立
         （readwise=Inbox/Later/JRead、instapaper=未讀/已加星/封存）。 -->
    <div class="jr-tabs" id="jr-tabs"></div>
    <div class="jr-list" id="jr-list"></div>
    <!-- 預設可見「載入中…」：即使 JS 因故沒跑（iOS 平台問題）頁面也不會全白，
         JS 接手後由 reader-feed.js 換成卡片或對應訊息。 -->
    <div class="jr-msg" id="jr-msg">載入中…</div>
  </main>

  <!-- 只載 feed 需要的最小集合：NS 命名空間、預設值、toast、Reader API、feed app。
       不載 styler / floating-icon / main 等 reader 閱讀模式模組（那些在 article.html）。 -->
  <script src="../content/namespace.js"></script>
  <script src="../content/settings-defaults.js"></script>
  <script src="../content/toast.js"></script>
  <!-- v1.6.0：Instapaper client + gitignored 金鑰（keys 缺檔時 __JReadInstapaper
       仍載入、getInstapaperConsumerKeys 回 null，Readwise 照常）。須在 popup-core 前。 -->
  <script src="../lib/instapaper-keys.js"></script>
  <script src="../lib/instapaper.js"></script>
  <script src="../popup/popup-core.js"></script>
  <script src="reader-cache.js"></script>
  <script src="reader-feed.js"></script>
</body>
</html>
