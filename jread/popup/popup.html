<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>JRead</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
      font-size: 14px;
      color: #222;
    }
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 4px;
    }
    .version {
      color: #888;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .status {
      background: #f4f4f4;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #555;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 0;
      border-radius: 6px;
      background: #2b6cb0;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #2c5282; }
    .options-link {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      color: #2b6cb0;
      text-decoration: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>JRead</h1>
  <div class="version">v<span id="version"></span></div>
  <div class="status" id="status">準備中⋯</div>
  <button id="toggle-btn">切換閱讀模式</button>
  <a href="#" class="options-link" id="open-options">偏好設定</a>
  <script src="popup.js"></script>
</body>
</html>
