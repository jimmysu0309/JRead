<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>JRead</title>
  <style>
    /* ==========================================================
       JRead Design Tokens (inlined — standalone popup)
       ========================================================== */
    :root {
      /* Brand blue — the only chromatic accent */
      --jr-primary-50:  #ebf4ff;
      --jr-primary-600: #2b6cb0;
      --jr-primary-700: #2c5282;

      /* Neutrals */
      --jr-neutral-50:  #fafafa;
      --jr-neutral-100: #f0f0f0;
      --jr-neutral-300: #cccccc;
      --jr-neutral-500: #888888;
      --jr-neutral-700: #444444;
      --jr-neutral-900: #222222;

      --jr-surface:     #ffffff;

      /* Danger */
      --jr-danger-text: #c53030;
      --jr-danger-bg:   #fff5f5;

      /* Reading themes — WYSIWYG swatches */
      --jr-read-light-bg:   #ffffff;
      --jr-read-light-fg:   #222222;
      --jr-read-dark-bg:    #1a1a1a;
      --jr-read-dark-fg:    #e4e4e4;
      --jr-read-sepia-bg:   #f4ecd8;
      --jr-read-sepia-fg:   #3a3226;

      /* Type stacks */
      --jr-font-ui:      system-ui, -apple-system, "Noto Sans TC", sans-serif;
      --jr-font-reading: "Noto Serif TC", Georgia, "Times New Roman", serif;
      --jr-font-mono:    ui-monospace, Menlo, Consolas, monospace;

      /* Spacing */
      --jr-space-1: 4px;
      --jr-space-2: 8px;
      --jr-space-3: 12px;
      --jr-space-4: 16px;
      --jr-space-6: 24px;

      /* Radius */
      --jr-radius-sm: 4px;
      --jr-radius-md: 6px;
    }

    /* ==========================================================
       Base
       ========================================================== */
    * { box-sizing: border-box; }
    html { font-family: var(--jr-font-ui); font-size: 14px; color: var(--jr-neutral-900); }
    body {
      width: 300px;
      margin: 0;
      padding: var(--jr-space-4);
      background: var(--jr-surface);
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================
       Header — logomark + wordmark + version
       ========================================================== */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: var(--jr-space-3);
    }
    .logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      background: var(--jr-primary-600);
      border-radius: var(--jr-radius-md);
      display: grid;
      place-items: center;
      color: #fff;
      font-family: var(--jr-font-reading);
      font-weight: 600;
      font-size: 18px;
      line-height: 1;
      letter-spacing: -0.02em;
      /* tiny optical shift so the J sits centered */
      padding-right: 2px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.005em;
      color: var(--jr-neutral-900);
    }
    .version {
      margin-left: auto;
      font-family: var(--jr-font-mono);
      font-size: 10px;
      color: var(--jr-neutral-500);
      letter-spacing: 0.04em;
      padding-top: 1px;
    }

    /* ==========================================================
       Status (error)
       ========================================================== */
    #status {
      background: var(--jr-danger-bg);
      color: var(--jr-danger-text);
      padding: var(--jr-space-2) var(--jr-space-3);
      border-radius: var(--jr-radius-sm);
      margin-bottom: var(--jr-space-3);
      font-size: 12px;
      line-height: 1.5;
    }

    /* ==========================================================
       Primary CTA — toggle
       ========================================================== */
    #toggle-btn {
      width: 100%;
      padding: 10px 14px;
      font-family: var(--jr-font-ui);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--jr-primary-600);
      border-radius: var(--jr-radius-md);
      background: var(--jr-primary-600);
      color: #fff;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
      letter-spacing: 0.01em;
    }
    #toggle-btn:hover {
      background: var(--jr-primary-700);
      border-color: var(--jr-primary-700);
    }
    #toggle-btn:active { transform: translateY(0.5px); }
    #toggle-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--jr-primary-50);
    }

    /* ==========================================================
       Secondary CTA — YouTube Borderless（v0.7.134）/ Readwise
       兩顆共用次級按鈕樣式：白底 / 灰邊 / 黑字
       ========================================================== */
    #borderless-btn,
    #readwise-btn {
      width: 100%;
      margin-top: var(--jr-space-2);
      padding: 9px 14px;
      font-family: var(--jr-font-ui);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--jr-neutral-300);
      border-radius: var(--jr-radius-md);
      background: var(--jr-surface);
      color: var(--jr-neutral-900);
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      letter-spacing: 0.01em;
    }
    #borderless-btn:hover:not(:disabled),
    #readwise-btn:hover:not(:disabled) {
      background: var(--jr-neutral-50);
      border-color: var(--jr-neutral-500);
    }
    #borderless-btn:focus-visible,
    #readwise-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--jr-primary-50);
    }
    #borderless-btn:disabled,
    #readwise-btn:disabled {
      color: var(--jr-neutral-500);
      background: var(--jr-neutral-50);
      border-color: var(--jr-neutral-100);
      cursor: not-allowed;
    }
    #readwise-status {
      margin-top: var(--jr-space-2);
      font-size: 12px;
      line-height: 1.5;
      padding: var(--jr-space-2) var(--jr-space-3);
      border-radius: var(--jr-radius-sm);
    }
    #readwise-status.ok {
      background: #f0fff4;
      color: #2f855a;
    }
    #readwise-status.err {
      background: var(--jr-danger-bg);
      color: var(--jr-danger-text);
    }
    #readwise-status.info {
      background: var(--jr-primary-50);
      color: var(--jr-primary-700);
    }

    /* ==========================================================
       Settings section
       ========================================================== */
    .settings {
      margin-top: var(--jr-space-4);
      padding-top: var(--jr-space-3);
      border-top: 1px solid var(--jr-neutral-100);
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--jr-space-3);
      min-height: 28px;
    }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-row > label {
      font-size: 13px;
      color: var(--jr-neutral-700);
    }

    /* ==========================================================
       Theme group — WYSIWYG
       ========================================================== */
    .theme-group {
      display: flex;
      /* 對齊下方 stepper 總寬（26 + 56 + 26 + 2 border = 110px），使用
         space-between 讓三顆按鈕自動撐開到同寬 row。 */
      width: 110px;
      justify-content: space-between;
    }
    .theme-btn {
      width: 32px;
      height: 28px;
      padding: 0;
      border-radius: var(--jr-radius-sm);
      cursor: pointer;
      font-family: var(--jr-font-ui);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      transition: transform 0.1s ease, box-shadow 0.12s ease;
      /* outer "ring" area reserved so active state lands on-grid */
      border: 1px solid var(--jr-neutral-300);
    }
    .theme-btn[data-theme="light"] { background: var(--jr-read-light-bg); color: var(--jr-read-light-fg); }
    .theme-btn[data-theme="dark"]  { background: var(--jr-read-dark-bg);  color: var(--jr-read-dark-fg);  border-color: var(--jr-read-dark-bg); }
    .theme-btn[data-theme="sepia"] { background: var(--jr-read-sepia-bg); color: var(--jr-read-sepia-fg); border-color: #e4d9bf; }

    .theme-btn:hover { transform: translateY(-0.5px); }
    .theme-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--jr-primary-50); }

    .theme-btn.active {
      box-shadow: 0 0 0 2px var(--jr-primary-600);
      border-color: transparent;
    }

    /* ==========================================================
       Stepper (− value +) — shared
       ========================================================== */
    .stepper {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid var(--jr-neutral-300);
      border-radius: var(--jr-radius-sm);
      background: var(--jr-surface);
      overflow: hidden;
      height: 28px;
    }
    .stepper button {
      width: 26px;
      height: 100%;
      border: 0;
      background: var(--jr-neutral-50);
      cursor: pointer;
      font-family: var(--jr-font-ui);
      font-size: 14px;
      line-height: 1;
      color: var(--jr-neutral-700);
      padding: 0;
      transition: background 0.1s ease, color 0.1s ease;
    }
    .stepper button:hover { background: var(--jr-neutral-100); color: var(--jr-neutral-900); }
    .stepper button:active { background: var(--jr-neutral-300); }
    .stepper button:focus-visible {
      outline: none;
      background: var(--jr-primary-50);
      color: var(--jr-primary-700);
    }
    .stepper button:disabled {
      color: var(--jr-neutral-300);
      background: var(--jr-neutral-50);
      cursor: not-allowed;
    }
    .stepper .val {
      width: 56px;
      padding: 0;
      text-align: center;
      font-family: var(--jr-font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      line-height: 26px;
      color: var(--jr-neutral-900);
      border-left: 1px solid var(--jr-neutral-300);
      border-right: 1px solid var(--jr-neutral-300);
      background: var(--jr-surface);
      flex: 0 0 auto;
    }

    /* ==========================================================
       Font-family select — 對齊其他 row 元件 110px / 28px
       ========================================================== */
    .font-family-select {
      width: 110px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--jr-neutral-300);
      border-radius: var(--jr-radius-sm);
      background: var(--jr-surface);
      color: var(--jr-neutral-900);
      font-family: var(--jr-font-ui);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23888888' d='M0 0l5 6 5-6z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
      padding-right: 24px;
    }
    .font-family-select:hover { border-color: var(--jr-neutral-500); }
    .font-family-select:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--jr-primary-50); }

    /* ==========================================================
       Auto toggle — off = ghost, on = filled blue
       ========================================================== */
    .font-controls { display: inline-flex; align-items: center; gap: 6px; }
    .auto-btn {
      height: 28px;
      padding: 0 10px;
      border-radius: var(--jr-radius-sm);
      border: 1px solid var(--jr-neutral-300);
      background: var(--jr-neutral-50);
      color: var(--jr-neutral-700);
      font-family: var(--jr-font-ui);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s ease, color 0.1s ease, border-color 0.1s ease;
      line-height: 1;
    }
    .auto-btn:hover { background: var(--jr-neutral-100); color: var(--jr-neutral-900); }
    .auto-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--jr-primary-50); }
    .auto-btn.active {
      background: var(--jr-primary-600);
      border-color: var(--jr-primary-600);
      color: #fff;
    }
    .auto-btn.active:hover {
      background: var(--jr-primary-700);
      border-color: var(--jr-primary-700);
    }

    /* ==========================================================
       Footer: shortcut hint + options link（同一 row 左右分配）
       ========================================================== */
    .footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--jr-space-2);
      margin-top: var(--jr-space-4);
      padding-top: var(--jr-space-3);
      border-top: 1px solid var(--jr-neutral-100);
    }
    .hint {
      font-family: var(--jr-font-ui);
      font-size: 12px;
      font-weight: 400;
      color: var(--jr-neutral-500);
      line-height: 1.5;
    }
    .hint code {
      display: inline-block;
      font-family: var(--jr-font-mono);
      font-size: 10px;
      padding: 2px 5px;
      border: 1px solid var(--jr-neutral-300);
      border-bottom-width: 2px;
      border-radius: var(--jr-radius-sm);
      background: var(--jr-neutral-50);
      color: var(--jr-neutral-900);
      line-height: 1;
      letter-spacing: 0.02em;
      margin: 0 1px;
    }

    .options-link {
      font-family: var(--jr-font-ui);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--jr-primary-600);
      text-decoration: none;
      border-radius: var(--jr-radius-sm);
      transition: color 0.1s ease;
      white-space: nowrap;
    }
    .options-link:hover { color: var(--jr-primary-700); text-decoration: underline; text-underline-offset: 3px; }
    .options-link:focus-visible { outline: none; color: var(--jr-primary-700); box-shadow: 0 0 0 3px var(--jr-primary-50); }
  </style>
</head>
<body>
  <div class="brand">
    <div class="logo" aria-hidden="true">J</div>
    <h1>JRead</h1>
    <div class="version">v<span id="version"></span></div>
  </div>

  <div id="status" hidden></div>
  <button id="toggle-btn">切換閱讀模式</button>
  <button id="borderless-btn" hidden title="影片填滿視窗 + 自動 resize 視窗高度匹配影片比例（YouTube watch 頁專用）">啟動無邊模式</button>
  <button id="readwise-btn" hidden title="把當前 reader card 內容送到 Readwise Reader">送到 Readwise Reader</button>
  <div id="readwise-status" hidden></div>

  <section class="settings">
    <div class="setting-row">
      <label>主題</label>
      <div class="theme-group" role="group" aria-label="主題">
        <button class="theme-btn" data-theme="light" title="亮色">亮</button>
        <button class="theme-btn" data-theme="dark"  title="暗色">暗</button>
        <button class="theme-btn" data-theme="sepia" title="米色">米</button>
      </div>
    </div>

    <div class="setting-row">
      <label>字級</label>
      <div class="font-controls">
        <button class="auto-btn" id="font-auto-btn"
          title="保留各站點原本的字級（不覆寫）">自動</button>
        <div class="stepper">
          <button data-action="font-dec" aria-label="字級減小">−</button>
          <span class="val" id="font-size-val">18</span>
          <button data-action="font-inc" aria-label="字級放大">+</button>
        </div>
      </div>
    </div>

    <div class="setting-row">
      <label>版心寬度</label>
      <div class="stepper">
        <button data-action="width-dec" aria-label="版心變窄">−</button>
        <span class="val" id="content-width-val">720</span>
        <button data-action="width-inc" aria-label="版心變寬">+</button>
      </div>
    </div>

    <div class="setting-row">
      <label for="font-family-select">字型</label>
      <select id="font-family-select" class="font-family-select" aria-label="字型">
        <option value="system-ui">系統預設</option>
        <option value="&quot;Noto Serif TC&quot;, Georgia, &quot;Times New Roman&quot;, serif">襯線</option>
        <option value="&quot;Noto Sans TC&quot;, -apple-system, &quot;Helvetica Neue&quot;, sans-serif">無襯線</option>
        <option value="ui-monospace, Menlo, Consolas, monospace">等寬</option>
      </select>
    </div>
  </section>

  <div class="footer">
    <div class="hint" id="shortcut-hint">
      <code>⌥</code><code>R</code> 切換純閱讀
    </div>
    <a href="#" class="options-link" id="open-options">進階設定 →</a>
  </div>

  <script src="popup-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
