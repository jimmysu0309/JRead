<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>JRead — Promo Tile (Standard)</title>
<style>
  :root {
    --jr-primary-600: #2b6cb0;
    --jr-neutral-100: #f0f0f0;
    --jr-neutral-300: #cccccc;
    --jr-neutral-500: #888888;
    --jr-neutral-700: #444444;
    --jr-neutral-900: #222222;
    --jr-bg:          #faf8f3;
    --jr-font-ui:      system-ui, -apple-system, "Noto Sans TC", sans-serif;
    --jr-font-reading: "Noto Serif TC", Georgia, "Times New Roman", serif;
    --jr-font-mono:    ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; padding: 0; background: #e5e5e5; font-family: var(--jr-font-ui); }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; }

  /* EXACTLY 440 × 280 — this is the node to screenshot */
  .tile {
    width: 440px;
    height: 280px;
    box-sizing: border-box;
    background: var(--jr-bg);
    position: relative;
    overflow: hidden;
    color: var(--jr-neutral-900);
    -webkit-font-smoothing: antialiased;
    /* subtle shadow so the 440×280 canvas is visible against the page bg;
       does NOT appear in a node screenshot of the inner tile itself */
    box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 10px 30px rgba(0,0,0,0.08);
  }

  /* Safe area = 320 × 200, centered */
  .safe {
    position: absolute;
    left: 60px;       /* (440 - 320) / 2 */
    top: 40px;        /* (280 - 200) / 2 */
    width: 320px;
    height: 200px;
    display: grid;
    grid-template-columns: 184px 136px; /* text gets more room, cards stay compact */
    gap: 0;
    align-items: stretch;
  }

  /* ---------- LEFT: type ---------- */
  .left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 28px; /* breathing room between 'd' and the cards */
  }
  .wordmark {
    font-family: var(--jr-font-reading);
    font-weight: 600;
    font-size: 54px;
    line-height: 1;
    letter-spacing: -0.025em;
    color: var(--jr-neutral-900);
    margin: 0;
  }
  .wordmark em {
    color: var(--jr-primary-600);
    font-style: normal;
  }
  .tagline-zh {
    font-family: var(--jr-font-reading);
    font-size: 20px;
    line-height: 1.3;
    letter-spacing: -0.005em;
    color: var(--jr-neutral-900);
    margin: 14px 0 0;
    font-weight: 500;
  }
  .tagline-en {
    font-family: var(--jr-font-ui);
    font-size: 11px;
    line-height: 1.4;
    color: var(--jr-neutral-500);
    margin: 8px 0 0;
    letter-spacing: 0.01em;
  }

  /* ---------- RIGHT: the "messy → clean" visual ---------- */
  .right {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    align-items: center;
    position: relative;
  }
  .mini {
    height: 140px;
    background: #fff;
    border: 1px solid var(--jr-neutral-300);
    border-radius: 4px;
    padding: 8px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 5px;
    position: relative;
  }
  /* tiny mono label under each card */
  .mini::after {
    content: attr(data-label);
    position: absolute;
    left: 0; right: 0;
    bottom: -14px;
    text-align: center;
    font-family: var(--jr-font-mono);
    font-size: 9px;
    color: var(--jr-neutral-500);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* LEFT CARD — messy: colored blocks = ads */
  .mini.messy {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 3px;
    padding: 6px;
  }
  .mini.messy span {
    background: var(--jr-neutral-300);
    border-radius: 2px;
  }
  .mini.messy span.a { background: #e9b8b8; }
  .mini.messy span.b { background: #e9d6b8; }
  .mini.messy span.c { background: #c8dcc0; }
  .mini.messy span.d { background: #bccfe3; }
  .mini.messy span.e { background: #d9c8e3; }
  .mini.messy span.wide { grid-column: span 2; }
  .mini.messy span.tall { grid-row: span 2; }

  /* RIGHT CARD — clean: just text lines */
  .mini.clean {
    justify-content: flex-start;
    padding: 12px 10px;
    gap: 7px;
  }
  .mini.clean .line {
    height: 3px;
    background: var(--jr-neutral-300);
    border-radius: 2px;
  }
  .mini.clean .line.title { height: 5px; background: var(--jr-neutral-700); width: 70%; margin-bottom: 4px; }
  .mini.clean .line.w90 { width: 92%; }
  .mini.clean .line.w80 { width: 82%; }
  .mini.clean .line.w70 { width: 72%; }
  .mini.clean .line.w60 { width: 60%; }

  /* arrow removed — contrast + labels carry the meaning */

  /* ---------- logomark, bottom-left INSIDE safe area ---------- */
  .logomark {
    position: absolute;
    left: 60px;
    bottom: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logomark .mark {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    background: var(--jr-primary-600);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--jr-font-reading);
    font-weight: 600;
    font-size: 14px;
    line-height: 1;
    letter-spacing: -0.02em;
    padding-bottom: 1px;
    box-sizing: border-box;
  }
  .logomark .kind {
    font-family: var(--jr-font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--jr-neutral-500);
  }

  /* subtle hairline marking the safe area in a tweak mode (off by default) */
  .debug .safe { outline: 1px dashed rgba(43,108,176,0.3); }
  .debug .tile::before {
    content: "440 × 280  ·  safe 320 × 200";
    position: absolute;
    top: 6px; right: 8px;
    font-family: var(--jr-font-mono);
    font-size: 9px;
    color: var(--jr-neutral-500);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
  <div class="tile" id="tile">
    <div class="safe">
      <!-- LEFT: type -->
      <div class="left">
        <div class="wordmark">J<em>Read</em></div>
        <div class="tagline-zh">一鍵純閱讀</div>
        <div class="tagline-en">Quiet the web. Read the text.</div>
      </div>

      <!-- RIGHT: messy → clean -->
      <div class="right">
        <div class="mini messy" data-label="web">
          <span class="a wide"></span><span></span>
          <span></span><span class="b"></span><span class="c"></span>
          <span class="d tall"></span><span class="wide"></span>
          <span class="e"></span><span></span>
          <span class="wide"></span><span class="a"></span>
        </div>
        <div class="mini clean" data-label="jread">
          <div class="line title"></div>
          <div class="line w90"></div>
          <div class="line w80"></div>
          <div class="line w90"></div>
          <div class="line w70"></div>
          <div class="line w80"></div>
          <div class="line w60"></div>
        </div>
      </div>
    </div>

    <!-- logomark: just the mark, in corner -->
    <div class="logomark">
      <div class="mark">J</div>
    </div>
  </div>
</body>
</html>
